.game-shell>.game-stage>.board{flex:1;min-height:0;height:auto!important;width:100%;max-width:none;aspect-ratio:auto;margin:0 auto;position:relative}
.game-shell .isometric-base{filter:drop-shadow(0 13px 10px #000c)}
.game-shell .board .cell{width:8.4%;height:9%;min-width:0}
.game-shell .board .cell .tokens{top:var(--pawn-top,28%);left:var(--pawn-left,50%);transform:translate(-50%,-50%);width:125%;height:54px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;align-content:center;gap:1px;overflow:visible}
.game-shell .board .cell .tokens .token{flex:0 0 auto}
.game-shell .board .cell:has(.token){z-index:11}
.game-shell .board .cell:has(.token) .tokens{z-index:30}
.game-shell .board .cell .tile-icon{font-size:clamp(13px,1.6vw,23px)}
.game-shell .board .cell small{font-size:clamp(6px,.72vw,11px)}
.game-shell .team-hud{max-width:186px;width:19%;padding:7px 9px;pointer-events:none}
.game-shell .team-hud.hud-0{top:1.5%;left:1.2%}
.game-shell .team-hud.hud-1{top:1.5%;right:1.2%}
.game-shell .team-hud.hud-2{bottom:1.5%;right:1.2%}
.game-shell .team-hud.hud-3{bottom:1.5%;left:1.2%}
.game-shell .centerboard{width:40%;height:46%;top:50%;transform:translate(-50%,-51%)}
.game-shell .centerboard h2{font-size:clamp(27px,3.1vw,48px)}
.game-shell .centerboard .crystal-court{height:clamp(45px,6.6vw,94px);width:clamp(52px,7vw,104px)}
.game-shell .centerboard .dice-scene{min-height:56px;transform:scale(.67)}
.game-shell .centerboard>.hint{font-size:10px}
.game-shell .game-sidebar{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:12px;gap:10px;scrollbar-color:#9b8255 #092b24}
.game-shell .game-sidebar>.col{display:contents}
.game-shell .game-sidebar>.col:first-child{display:none}
.game-shell .game-sidebar>.col:nth-child(2){display:flex;gap:10px}
.game-shell .game-sidebar .panel{padding:14px;border-radius:14px}
.game-shell .game-sidebar .question{display:flex;flex-direction:column;gap:4px}
.game-shell .game-sidebar .question h3{font-size:clamp(15px,1.2vw,18px);line-height:1.35;margin:8px 0}
.game-shell .game-sidebar .option{font-size:13px;line-height:1.35;padding:10px 12px;margin-top:5px}
.game-shell .game-sidebar .controls{margin:7px 0}
.game-shell .game-sidebar .turn{font-size:17px}
.game-shell .game-sidebar .panel:has(.log){display:none}
.game-shell .game-sidebar .panel:has(.people){max-height:230px;overflow:auto}
.stage-action-dock{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:auto}
.stage-action-dock button{border-radius:999px;min-width:175px;padding:11px 23px;font-size:14px;font-weight:800;box-shadow:0 5px 0 #6b4925,0 10px 28px #000c,0 0 15px #d9ab4355}
.stage-action-dock button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4925,0 5px 12px #0008}
.game-shell .dice-overlay{position:fixed;inset:0;background:#001f1ae8;border:0;border-radius:0;z-index:150;display:flex;align-items:center;justify-content:center;pointer-events:all;backdrop-filter:blur(9px)}
.game-shell .dice-overlay .dice-scene{transform:scale(1.2);min-height:130px}
.game-shell .dice-overlay .dice-caption{font-size:21px}
@media(max-width:1000px){.game-shell{grid-template-columns:minmax(0,1fr) 320px}.game-shell .team-hud{width:18%;padding:4px 5px}.game-shell .team-hud .hud-figure{font-size:22px}.game-shell .team-hud .hud-name{font-size:15px}.game-shell .team-hud .hud-meta{font-size:9px}.game-shell .board .cell small{font-size:6px}.game-shell .board .cell .tile-icon{font-size:14px}}
@media(max-width:720px){.game-shell{grid-template-columns:1fr;grid-template-rows:minmax(0,60%) minmax(0,40%)}.game-shell>.game-stage{border-right:0;border-bottom:1px solid #c5a658;height:100%}.game-shell .game-sidebar{height:100%;padding:7px}.game-shell .centerboard h2{font-size:clamp(17px,4vw,28px)}.game-shell .centerboard .crystal-court{width:43px;height:43px}.game-shell .centerboard p{font-size:7px}.game-shell .centerboard .dice-scene{min-height:37px;transform:scale(.48)}.game-shell .board .cell{width:9%;height:9%}.game-shell .board .cell small{font-size:5px}.game-shell .board .cell .tile-icon{font-size:10px}.game-shell .board .cell .tokens{height:30px;gap:0}.game-shell .team-hud{width:20%;padding:3px 4px;border-radius:7px}.game-shell .team-hud .hud-name{font-size:12px}.game-shell .team-hud .hud-meta{font-size:7px}.game-shell .team-hud .hud-figure{font-size:16px}.game-shell .stage-header{height:24px;flex-basis:24px}.game-shell .stage-header .pill{font-size:9px;padding:2px 7px}.stage-action-dock{bottom:0}.stage-action-dock button{font-size:11px;padding:7px 14px;min-width:130px}.game-shell .game-sidebar .question h3{font-size:14px}.game-shell .game-sidebar .option{font-size:12px;padding:7px 10px}.game-shell .game-sidebar .panel{padding:9px}}
@media(max-height:650px) and (min-width:721px){.game-shell .team-hud{padding:3px 6px}.game-shell .team-hud .hud-name{font-size:14px}.game-shell .team-hud .hud-meta{font-size:9px}.game-shell .centerboard .crystal-court{height:46px;width:50px}.game-shell .centerboard h2{font-size:27px}.game-shell .centerboard .dice-scene{min-height:44px;transform:scale(.55)}.stage-action-dock button{padding:7px 15px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="sub">Інтерактивна юридична стратегія • демоверсія</div><div class="brand">⚖ ГОСПОДАРСЬКА <span>МОНОПОЛІЯ</span></div></div><div class="pill" id="roomLabel">Навчальна гра • ГПК України</div></header><div id="app"></div><footer class="foot">Демонстраційний режим на одному пристрої • Умовні бали не є судовими платежами • Перед заняттям звіряйте завдання з актуальною редакцією ГПК</footer></div><script>
const $=s=>document.querySelector(s), app=$('#app');let room=new URLSearchParams(location.search).get('room')?.toUpperCase()||'',token='',state=null,err='',joined=false,loading=false;const storageKey=r=>'game_v2_'+r;let lastVote='';
const e=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const DATA_Q=[["Після повернення позову внаслідок неусунення недоліків позивач усунув недоліки та повторно звернувся до суду. Яка процесуальна оцінка повторного звернення?",["Повторний позов є недопустимим через тотожність із поверненою заявою.","Повторне звернення можливе після усунення обставин, що спричинили повернення; дата подання визначається за новим зверненням.","Позов вважається поданим у день першого звернення навіть після повернення.","Повторне звернення можливе лише після оскарження ухвали про повернення."],1,"Повернення заяви не перешкоджає повторному зверненню після усунення недоліків; не слід плутати це із своєчасним усуненням недоліків заяви, залишеної без руху.","174","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["ТОВ звернулося з вимогою до фізичної особи-поручителя за договором, який забезпечує виконання зобов’язання між двома суб’єктами господарювання. Що є визначальним для предметної юрисдикції?",["Сам факт участі фізичної особи як відповідача завжди зумовлює цивільну юрисдикцію.","Обов’язково треба встановити, чи є поручитель фізичною особою-підприємцем.","Необхідно врахувати характер основного зобов’язання та законодавчі критерії юрисдикції спору щодо забезпечувального правочину.","Юрисдикція визначається лише договірним застереженням сторін про суд."],2,"Юрисдикція спору щодо забезпечувального правочину визначається з урахуванням правил ст. 20 ГПК і характеру основного зобов’язання, а не лише статусу поручителя.","20","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Підписант позову поставив лише рукописний автограф; із заяви та додатків неможливо встановити його повноваження. Який підхід належний?",["Автограф автоматично підтверджує повноваження директора незалежно від змісту додатків.","Суд повинен перевірити повноваження підписанта за наявними процесуальними документами й реєстраційними даними, а не вважати сам автограф достатнім підтвердженням.","Підписати позов може виключно адвокат, тому будь-який підпис керівника недопустимий.","Встановлення повноважень відкладається до ухвалення рішення по суті."],1,"Сам рукописний підпис не замінює належної перевірки особи та її повноважень. Наслідок залежить від характеру дефекту підписання і процесуальної стадії.","162, 174","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позивач після закінчення встановленого судом строку подав «додаткові пояснення» з новою правовою та фактичною аргументацією, хоча суд не визнавав їх подання необхідним. Яке вирішення найбільш обґрунтоване?",["Долучити пояснення, оскільки письмові заяви по суті можна подавати без процесуальних обмежень.","Розглянути їх як обов’язкову заяву по суті, але зменшити судові витрати.","За відсутності дозволу суду на додаткові пояснення та підстав подолати процесуальні строки залишити їх без розгляду.","Автоматично повернути позов як санкцію за подання додаткових пояснень."],2,"Частина 5 ст. 161 ГПК передбачає можливість подання додаткових пояснень із дозволу суду, якщо суд визнає їх необхідними. ВП ВС, справа № 925/1133/18.","161, 118","https://reyestr.court.gov.ua/Review/120396091"],["Відповідач, фізична особа, просить про звільнення від збору під час апеляційного оскарження та доводить, що розмір збору перевищує встановлену законом частку його річного доходу. Суд відмовляє тільки тому, що заявник є відповідачем. Чи правильний підхід?",["Так, закон допускає пільгу за майновим станом виключно для позивача.","Ні, суд повинен оцінити докази наявності передбаченої законом підстави незалежно від процесуального статусу фізичної особи.","Так, оскільки процесуальний статус виключає судовий розсуд навіть за наявності доказів.","Ні, суд зобов’язаний автоматично звільнити кожну фізичну особу від збору."],1,"ВП ВС у справі № 906/308/20: не можна відмовляти лише з тієї причини, що фізична особа виступає відповідачем; потрібне дослідження підстав ст. 8 Закону «Про судовий збір».","2; Закон про судовий збір, ст. 8","https://reyestr.court.gov.ua/Review/115598835"],["Сторона подала лише скриншоти переписки в месенджері. Інша сторона заперечує їхній зміст і походження. Яка дія відповідає принципам оцінки доказів?",["Відкинути будь-які скриншоти, оскільки електронний доказ існує виключно з КЕП.","Визнати скриншоти безумовно достовірними, якщо на них видно номер телефону.","З’ясувати належність, допустимість, достовірність та зв’язок із іншими доказами; за потреби дослідити електронний оригінал.","Змінити тягар доказування на суд і самостійно встановити автентичність без участі сторін."],2,"Електронне листування та повідомлення месенджерів оцінюються за правилами доказування й у сукупності з іншими матеріалами; форма скриншота сама по собі не вирішує питання достовірності.","73, 86, 96","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Команда отримала актив «Майстер доказування». Суперник просить автоматично надати експертному висновку перевагу над іншими доказами. Як має діяти суд?",["Надати висновку перевагу, якщо експерта призначено ухвалою суду.","Покласти висновок в основу рішення, якщо сторона сплатила експертизу.","Оцінити висновок за загальними правилами, оскільки наперед установленої доказової сили він не має.","Відхилити всі інші докази, якщо висновок не був оскаржений."],2,"Статті 86, 104 ГПК: висновок експерта не має наперед установленої сили, а відхилення висновку потребує мотивування.","86, 104","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Апелянт подав клопотання про поновлення строку. У ньому наведено статті ГПК і цитати постанов, але не описано жодної фактичної причини пропуску. Яка оцінка?",["Цитування правових норм саме собою є достатнім обґрунтуванням поважності причин.","Зазначення норм не замінює викладення конкретних обставин та доказів, що об’єктивно пояснюють пропуск строку.","Будь-який пропуск автоматично є поважним після подання клопотання.","Суд зобов’язаний відмовити незалежно від того, чи можна додати докази причин."],1,"КГС ВС, справа № 910/186/21: цитати норм і практики самі собою не є порушенням питання про поновлення строку та не доводять поважності причин.","119, 256","https://reyestr.court.gov.ua/Review/112029599"],["Суд забезпечив позов, не вимагаючи зустрічного забезпечення. Відповідач згодом доводить ризик збитків та просить застосувати зустрічне забезпечення. Яка процесуальна відповідь?",["Відмовити, бо клопотання можливе тільки до первинної ухвали про забезпечення.","Визнати первинну ухвалу нікчемною через відсутність зустрічного забезпечення.","Розглянути клопотання по суті: відсутність зустрічного забезпечення в первинній ухвалі не позбавляє такого права.","Автоматично скасувати основне забезпечення незалежно від змісту клопотання."],2,"КГС ВС, справа № 44/639-б (910/15659/24): суд вправі застосувати зустрічне забезпечення й після первинної ухвали за обґрунтованим клопотанням.","141","https://reyestr.court.gov.ua/Review/126866988"],["На бонусній клітинці команда оцінює компроміс: учасники уклали мирову угоду. Яка її процесуальна природа?",["Це процесуальна дія сторін, що потребує затвердження судом із перевіркою законних умов.","Це різновид відстрочення виконання, який не потребує перевірки судом.","Це спосіб примусового виконання, що завжди застосовується виконавцем.","Це новий позов, який автоматично об’єднується з первісним."],0,"Мирова угода відрізняється від процесуальної відстрочки або розстрочки виконання рішення; суд перевіряє її умови й допустимість.","192","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позов подано з дотриманням територіальної підсудності. Після відкриття провадження склад відповідачів змінився. Чи завжди це зумовлює передачу справи?",["Так, будь-яка зміна відповідача завжди вимагає передачі справи.","Ні, суд оцінює законні правила визначення підсудності, стадію та характер зміни; сама зміна складу осіб не створює автоматичної передачі.","Так, але лише якщо позивач погоджується з передачею.","Ні, господарську підсудність можна змінити лише угодою сторін."],1,"Підсудність і її зміни регулюються нормами ГПК; необхідно розмежовувати початкове визначення суду й випадки подальшої передачі.","27, 31","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["У справі про банкрутство ТОВ позов подає ліквідатор через свій електронний кабінет, але сама юридична особа електронного кабінету не зареєструвала. Чи достатньо кабінету ліквідатора?",["Так, повноваження ліквідатора поглинають процесуальний обов’язок юридичної особи.","Так, оскільки після визнання банкрутом обов’язкова реєстрація кабінету припиняється.","Ні, обов’язок юридичної особи мати власний електронний кабінет не замінюється кабінетом ліквідатора.","Ні, але лише якщо позов поданий до іншого господарського суду."],2,"Огляд КГС ВС 2026 окремо наголошує на самостійному обов’язку юридичної особи, у тому числі в процедурі банкрутства, зареєструвати електронний кабінет.","6","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Учасник просить визнати зловживанням повторний позов після добровільного залишення попереднього позову без розгляду. Який підхід найбільш виважений?",["Повторне звернення автоматично є зловживанням незалежно від обставин.","Суд повинен дослідити мету та поведінку учасника; сама повторність не доводить зловживання.","Зловживання процесуальними правами можливе лише в касації.","Факт повторності обов’язково зумовлює штраф у максимальному розмірі."],1,"Стаття 43 ГПК потребує оцінки обставин і добросовісності поведінки, а не формального висновку лише з повторного звернення.","43","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["На підготовчому засіданні відповідач вперше просить витребувати доказ, не пояснюючи, чому не подав відповідне клопотання раніше. Яке процесуальне питання є ключовим?",["Чи вважати будь-яке клопотання про витребування доказів своєчасним до дебатів.","Чи обґрунтовано неможливість самостійно отримати доказ та дотримано вимог до строку і змісту клопотання.","Чи погоджується позивач на витребування; його згода є обов’язковою.","Чи потрібно призначити експертизу замість витребування будь-якого документа."],1,"Стаття 81 ГПК установлює вимоги до клопотання про витребування доказів; процесуальний строк не можна ігнорувати.","81","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Свідок подав нотаріально посвідчену письмову заяву, а інша сторона просить викликати його для допиту. Чи є допит обов’язковою умовою оцінки письмових показань?",["Так, без допиту будь-яка письмова заява свідка автоматично недопустима.","Ні, суд оцінює письмові показання за процесуальними правилами; питання виклику вирішується залежно від підстав і обставин.","Так, але тільки коли свідок не є працівником сторони.","Ні, адже свідків у господарському процесі взагалі не передбачено."],1,"ГПК передбачає письмову заяву свідка; виклик не є механічно обов’язковим для оцінки всіх таких заяв, але можливий за умов Кодексу.","87–90","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позивач надав акт приймання-передачі, відповідач заперечив його автентичність і надав інші документи. Який стандарт судової оцінки?",["Акт позивача має безумовну перевагу через первинність подання.","Суд оцінює належність, допустимість, достовірність і вірогідність доказів у сукупності з мотивами прийняття або відхилення.","Заперечення відповідача автоматично позбавляє акт доказової сили.","Суд може врахувати виключно документи, що мають нотаріальне посвідчення."],1,"Статті 79 і 86 ГПК встановлюють оцінку вірогідності та доказів у сукупності; жоден документ не має наперед установленої сили.","79, 86","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Суд призначив експертизу в установі, що повідомила про надмірне завантаження. Інша державна установа може виконати її швидше. Чи вправі суд змінити установу?",["Ні, після ухвали визначена установа не може змінюватися за жодних умов.","Так, за наявності об’єктивних причин і належного мотивування така зміна допустима для забезпечення розумних строків.","Так, виключно за письмової згоди всіх учасників після призначення експертизи.","Ні, треба обов’язково скасувати всі попередні процесуальні дії і почати справу заново."],1,"КГС ВС у справі № 908/948/23 пояснив, що відсутність прямої норми про зміну установи не виключає її за об’єктивних причин.","99","https://supreme.court.gov.ua/supreme/pro_sud/rishennya_obedn_palati_kgs_vs/2025_07_04_908_948_23"],["Сторона просить компенсувати витрати на проїзд, проживання і добові представника для участі у засіданні в іншому місті. Який підхід?",["Ці витрати в принципі не можуть належати до судових витрат.","Такі витрати можуть належати до судових витрат за умови підтвердження та перевірки зв’язку з розглядом справи й розумності.","Ці витрати стягуються лише за наявності окремої угоди між сторонами.","Вони стягуються в повному розмірі автоматично, без жодних доказів."],1,"В огляді КГС ВС витрати на відрядження представника для участі в засіданні розглядаються як пов’язані з процесуальною дією та потенційно компенсовані за правилами ГПК.","123, 129","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторона подала висновок експерта, замовлений самостійно. У ньому не зазначено, що дослідження підготовлене для суду, та немає підтвердження обізнаності про кримінальну відповідальність. Який висновок?",["Документ відповідає всім вимогам, бо експерт має чинну кваліфікацію.","Достатньо процесуальної заяви сторони про те, що висновок подавався для суду.","Наведені недоліки зачіпають імперативні вимоги до такого висновку як судового доказу.","Висновок обов’язково має силу судової експертизи, навіть якщо його підготовлено для господарських переговорів."],2,"КГС ВС, справа № 911/1368/24: для висновку на замовлення учасника істотними є відомості про підготовку для суду та попередження про кримінальну відповідальність.","98, 101","https://reyestr.court.gov.ua/Review/136470342"],["Суд зупинив провадження у зв’язку з призначенням експертизи. Чи означає це остаточне припинення розгляду спору?",["Так, після ухвали про зупинення сторона мусить подати новий позов.","Ні, зупинення є тимчасовим процесуальним станом, а після усунення обставин провадження поновлюється.","Так, зупинення тотожне закриттю провадження.","Ні, але для поновлення потрібне нове рішення суду по суті спору."],1,"Статті 228–230 ГПК розмежовують зупинення та поновлення провадження.","228–230","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після вичерпання заяв по суті відповідач подав нові «письмові пояснення», що фактично змінюють заперечення. Суд не дозволяв додаткових пояснень. Що має значення?",["Назва «пояснення» дозволяє обійти строки й процедуру заяв по суті.","Суд має визначити процесуальний зміст документа та застосувати ст. 161 і правила строків; довільна назва не усуває обмежень.","Будь-яка заява відповідача автоматично стає зустрічним позовом.","Пояснення обов’язково розглядаються по суті навіть після дебатів."],1,"ВП ВС у справі № 925/1133/18 окреслила межі додаткових пояснень, що подаються з дозволу суду.","161, 118","https://reyestr.court.gov.ua/Review/120396091"],["У відзиві відповідач заперечив факт поставки, але не надіслав копії відзиву та доданих доказів іншим учасникам. Який підхід відповідає ст. 165 ГПК?",["Надсилання копій не потрібне, оскільки відзив адресований лише суду.","Відзив підлягає перевірці на дотримання обов’язку одночасного надсилання копій іншим учасникам та подання відповідних доказів надсилання.","Суд повинен автоматично визнати позов незалежно від причин ненадсилання.","Порушення можна виправити тільки під час касаційного перегляду."],1,"Стаття 165 ГПК передбачає надсилання відзиву та доданих до нього документів іншим учасникам одночасно з поданням до суду.","165","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Юридична особа обов’язково має електронний кабінет, але його не створила. Позивач подав позов через ЄСІТС і не направив паперові копії відповідачу поштою. Яка оцінка?",["Це безумовна підстава залишити позов без руху через ненадсилання паперових копій.","Такий позивач не повинен нести додаткового тягаря паперового надсилання лише через невиконання відповідачем обов’язку зареєструвати кабінет.","Позов є неподаним, доки відповідач добровільно не підтвердить ознайомлення.","Відсутність кабінету в відповідача автоматично припиняє провадження."],1,"ОП КГС ВС у справі № 908/3731/23 розмежувала обов’язок подавача і негативні наслідки для юридичної особи без обов’язкового кабінету.","6, 172, 242","https://reyestr.court.gov.ua/Review/121591790"],["Відповідач подав зустрічний позов після спливу строку для відзиву, обґрунтовуючи це зручністю спільного розгляду. Яка процесуальна умова вирішальна?",["Зустрічний позов приймається завжди, якщо обидві вимоги грошові.","Потрібно оцінити встановлений ст. 180 ГПК строк подання і взаємопов’язаність вимог; сама зручність не усуває пропуску строку.","Зустрічний позов можна заявити тільки після ухвалення рішення по первісному.","Достатньо усного погодження сторін поза судом."],1,"Стаття 180 ГПК визначає як часові вимоги, так і умови спільного розгляду зустрічного та первісного позовів.","180","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Суд розглядає в межах справи про банкрутство спір, для якого закон передбачає загальне позовне провадження. Чи достатньо автоматично застосувати спрощене через сам факт банкрутства?",["Так, усі позови в межах банкрутства є виключно спрощеними.","Ні, суд повинен застосувати належну форму провадження з урахуванням спеціальних правил і характеру спору.","Так, якщо сторони не заперечували до подання відзиву.","Ні, всі такі позови повинні бути передані до адміністративного суду."],1,"КГС ВС роз’яснює співвідношення ст. 12 ГПК та ст. 7 КУзПБ у спорах за участі боржника.","12; КУзПБ, 7","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторони хочуть мирно врегулювати спір. Одна сторона просить суд затвердити домовленість, за якою виконання рішення лише розстрочується, без взаємних поступок щодо предмета спору. Яке розмежування важливе?",["Завжди оформлювати домовленість як мирову угоду, незалежно від змісту.","Встановити, чи йдеться про матеріально-правове врегулювання спору, чи про процесуальне розстрочення виконання за ст. 331 ГПК.","Усі домовленості щодо графіка виконання автоматично припиняють виконавче провадження.","Суд позбавлений права вирішувати питання розстрочення після ухвалення рішення."],1,"Огляд КГС ВС розмежовує мирову угоду та процесуальне відстрочення або розстрочення виконання судового рішення.","192, 331","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["На стадії врегулювання спору за участю судді учасник просить дослідити докази по суті й дати оцінку перспективам позову. Який підхід відповідає природі цієї процедури?",["Суддя зобов’язаний наперед викласти зміст майбутнього рішення по суті.","Процедура має примирювальну, а не доказово-вирішальну мету; суддя не повинен підмінювати нею вирішення спору.","Будь-які висловлювання судді під час врегулювання становлять рішення суду.","Процедура автоматично змінює предмет позову."],1,"Статті 186–190 ГПК установлюють особливу процедуру врегулювання спору за участю судді; її не слід змішувати з розглядом спору по суті.","186–190","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторона просить призначити експертизу лише для з’ясування того, чи є укладений договір нікчемним. Спеціальних фактичних питань не сформульовано. Яка відповідь?",["Призначити експертизу, оскільки експерт завжди вирішує правові питання за складними договорами.","Відмовити в експертизі для вирішення суто правового питання; оцінка правових наслідків договору є компетенцією суду.","Призначити експертизу без визначення предмета дослідження.","Зупинити справу до отримання висновку адвоката з правової експертизи."],1,"ОП КГС ВС, справа № 908/948/23: експертиза потрібна для спеціальних знань в іншій сфері, ніж право; правові питання належать до компетенції суду.","99","https://supreme.court.gov.ua/supreme/pro_sud/rishennya_obedn_palati_kgs_vs/2025_07_04_908_948_23"],["Команда має актив «Процесуальна стратегія». Опонент пропонує автоматично відкласти засідання через чергове клопотання адвоката про перебування за кордоном без підтвердних доказів. Яка реакція?",["Відкладати необмежену кількість разів лише на підставі заяви представника.","Оцінити поважність причин, наявність доказів і ризик зловживання процесуальними правами.","Вважати будь-яке перебування за кордоном остаточною підставою для закриття справи.","Відмовляти у всіх клопотаннях про відкладення під час воєнного стану."],1,"У практиці щодо ст. 43 і 202 ГПК наголошено на необхідності перевірки підстав та доказів повторних клопотань про відкладення.","43, 202","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Умовна бонусна картка: сторона хоче відшкодувати витрати на правничу допомогу. Яка модель оцінки найбільш коректна?",["Стягувати суму лише тому, що вона зазначена в договорі з адвокатом.","Оцінити належні докази витрат і критерії їх розподілу, зокрема співмірність та поведінку учасників, у межах вимог і заперечень.","Завжди ділити витрати порівну незалежно від результату спору.","Відмовляти у відшкодуванні лише тому, що адвокат працював дистанційно."],1,"Статті 126 і 129 ГПК регулюють доказування, співмірність та розподіл витрат на професійну правничу допомогу.","126, 129","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Суд першої інстанції ухвалив рішення, але не розв’язав питання про розподіл понесених судових витрат. Який процесуальний інструмент передбачений?",["Виключно новий самостійний позов про витрати.","За належних умов суд, який ухвалив рішення, може ухвалити додаткове рішення.","Лише виправлення описки в основному рішенні.","Автоматичне вирішення витрат державним виконавцем."],1,"Стаття 244 ГПК передбачає додаткове рішення, зокрема коли не вирішено питання про судові витрати.","244","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Заява про додаткове рішення подана через невирішені судові витрати. Після цього основне рішення скасоване апеляційним судом. Що слід врахувати?",["Додаткове рішення завжди існує незалежно від долі основного.","Додаткове рішення має похідний характер; скасування основного рішення впливає на його правову силу.","Додаткове рішення автоматично перетворюється на самостійний виконавчий документ щодо всіх вимог.","Апеляція не може торкатися додаткового рішення навіть за скасування основного."],1,"Додаткове рішення нерозривно пов’язане з основним; огляд КГС ВС висвітлює наслідки втрати його сили після скасування основного рішення.","244","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після ухвалення рішення сторона подає документ, називаючи його «уточненням позовних вимог», із новим предметом спору. Який підхід?",["Ухвалене рішення може змінюватися за таким зверненням поза законними процедурами перегляду.","Необхідно розмежувати виправлення описок, додаткове рішення, роз’яснення та оскарження; змінювати предмет вирішеного спору таким способом не можна.","Будь-яка заява після рішення автоматично стає апеляційною скаргою.","Суд повинен прийняти нові вимоги в межах завершеного розгляду."],1,"Статті 243–245 ГПК не є процедурою нового розгляду та зміни предмета вже вирішеного спору.","243–245","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторони не ставили в апеляції питання про юрисдикцію спору. Апеляційний суд виявив порушення правил предметної юрисдикції господарських судів. Що він має зробити?",["Ігнорувати порушення, оскільки в апеляції діє абсолютна заборона виходити за доводи скарги.","Перевірити юрисдикцію незалежно від доводів скарги, оскільки закон відносить таке порушення до обов’язкових підстав скасування.","Передати питання юрисдикції виключно на розгляд суду касаційної інстанції.","Відкрити окреме провадження щодо юрисдикції без перегляду рішення."],1,"КГС ВС у справі № 908/2037/20: апеляційний суд перевіряє предметну юрисдикцію незалежно від доводів скарги.","269, 278","https://reyestr.court.gov.ua/Review/103320420"],["У касаційній скарзі заявник посилається на неврахування апеляційним судом висновку Верховного Суду щодо застосування процесуальної норми в подібних правовідносинах. Чи може така підстава відповідати п. 1 ч. 2 ст. 287 ГПК?",["Ні, ця підстава стосується виключно неврахування висновків щодо норм матеріального права.","Так, підстава може охоплювати також процесуальні норми за умови виконання встановлених законом критеріїв касаційного оскарження.","Так, без необхідності встановлювати подібність правовідносин і зміст правового висновку.","Ні, процесуальні порушення ніколи не можуть бути підставою касаційного перегляду."],1,"ОП КГС ВС у справі № 908/2287/17 роз’яснила, що ця підстава може охоплювати неврахування висновків ВС щодо процесуального права, якщо виконані умови ст. 287 ГПК.","287","https://reyestr.court.gov.ua/Review/105837295"],["Заявник просить переглянути рішення за нововиявленими обставинами, посилаючись лише на новий правовий висновок ВС, сформований після рішення. Яка різниця істотна?",["Кожна нова постанова Верховного Суду сама собою є нововиявленою фактичною обставиною.","Нововиявлені обставини повинні відповідати визначеним законом критеріям істотних обставин, які існували на час розгляду; новий правовий підхід сам собою цим критеріям не відповідає.","Нововиявлені обставини можуть полягати лише у зміні складу суду.","Заява завжди приймається, якщо попереднє рішення вже виконано."],1,"Стаття 320 ГПК розмежовує істотні обставини, що існували на час розгляду, та нові докази або подальші зміни у праві.","320","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Стягувач отримав виконавчий документ. Боржник просить розстрочити виконання, посилаючись на скрутне становище. Яке процесуальне вирішення належне?",["Визнати виконання розстроченим автоматично за фактом подання заяви.","Розглянути заяву з перевіркою обставин, доказів, балансу інтересів і меж повноважень суду за ст. 331 ГПК.","Зобов’язати стягувача погодитися на довільний графік виконання.","Передати повноваження розстрочення виключно арбітражному керуючому."],1,"Стаття 331 ГПК передбачає судове вирішення заяв про відстрочку чи розстрочку з урахуванням доведених обставин.","331","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторона виконавчого провадження оскаржує бездіяльність виконавця. Після подання скарги вона заявила про відмову від неї. Яка процесуальна оцінка?",["Відмова від скарги завжди заборонена, бо розділ VI ГПК передбачає виключно розгляд по суті.","Суд має врахувати спеціальний режим судового контролю, диспозитивність та перевірити допустимість відповідної процесуальної відмови, а не автоматично підміняти скаргу позовом.","Відмова від скарги автоматично спричиняє скасування судового рішення, що виконується.","Відмова від скарги можлива тільки після порушення окремої справи про банкрутство."],1,"У систематизованому огляді КГС ВС окремо розглянуто процесуальну природу скарги на рішення, дії чи бездіяльність виконавця та допустимість відмови від неї.","339","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Судовий наказ видано за вимогою, для якої допускається наказне провадження. Боржник своєчасно заявив про скасування судового наказу. Який процесуальний підхід?",["Суд у наказному провадженні повинен провести повне дослідження всіх заперечень по суті.","За дотримання вимог ГПК суд вирішує питання про скасування наказу в передбаченому порядку, а стягувачу роз’яснює право на позов.","Судовий наказ не може бути скасований після його видачі.","Скарга боржника автоматично передається Верховному Суду."],1,"Статті 157–158 ГПК визначають процедуру подання заяви про скасування судового наказу та її процесуальні наслідки.","157–158","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після завершення кола команді випала клітинка «Фініш». Яка засаднича гарантія зберігається на всіх стадіях господарського процесу?",["Суд вправі необмежено змінювати предмет позову замість сторін.","Суд забезпечує змагальність і рівність сторін, не підмінюючи їхніх процесуальних обов’язків.","Право на перегляд не може обмежуватися жодними процесуальними умовами.","Змагальність означає обов’язок суду самостійно збирати всі докази замість сторін."],1,"Статті 2, 13, 14 ГПК закріплюють засади змагальності, диспозитивності та рівності учасників.","2, 13, 14","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"]], DATA_SPACES=["СТАРТ", "Юрисдикція", "Позовна заява", "Додаткові пояснення", "Судовий збір", "Доказування", "Процесуальний актив", "Строки", "Забезпечення позову", "БОНУС", "Підсудність", "Електронний суд", "Зловживання правами", "Підготовче засідання", "Свідки", "Доказування", "Експертиза", "Судові витрати", "Процесуальний актив", "ПАУЗА", "Заяви по суті", "Відзив", "Надсилання документів", "Зустрічний позов", "Спрощене провадження", "Примирення", "Врегулювання спору", "Розгляд по суті", "Відкладення розгляду", "БОНУС", "Судове рішення", "Додаткове рішення", "Уточнення рішення", "Апеляція", "Касація", "Перегляд рішення", "Виконання рішення", "Судовий контроль", "Наказне провадження", "ФІНІШ"], DATA_NAMES=["Феміда", "Прецедент", "Вердикт", "Правники", "Апеляція", "Юстиція"], DATA_COLORS=["#56b7ff", "#eead5d", "#75d4aa", "#bd96f7", "#f28c9d", "#9dc8ce"], DATA_SYMBOLS=["⚖️","📜","🔨","🧑‍⚖️","🔍","🛡️"];

function question(){let q=state.question;if(!q)return '';let active=state.phase==='voting';let isMyTeam=state.you?.team===state.turn;let answers=q.options.map((a,i)=>`<button class="option ${q.answered&&q.yourVote===i?'picked':''} ${state.phase==='result'&&i===q.answer?'right':''} ${state.phase==='result'&&q.yourVote===i&&i!==q.answer?'wrong':''}" ${active&&(isMyTeam||state.host)&&!q.answered?'': 'disabled'} data-vote="${i}"><b>${'АБВГ'[i]}.</b> ${e(a)} ${state.phase==='result'?`<span style="float:right">${q.votes?.[i]||0}</span>`:''}</button>`).join('');return `<div class="panel question"><div class="headerline"><span class="pill">${e(q.category)}</span><span class="hint">Голосів: ${q.count} / ${q.eligible}</span></div><h3>${e(q.text)}</h3>${answers}${active?`<p class="hint">${state.host?'Деморежим: оберіть відповідь від імені команди. Потім натисніть «Завершити голосування».':isMyTeam?(q.answered?'Ваш голос зараховано. Очікуйте результату.':'Оберіть відповідь зі свого пристрою.'):'Голосує команда «'+e(state.teams[state.turn].name)+'». Очікуйте.'}</p>`:''}${state.phase==='result'?`<div class="notice"><b>Правильна відповідь: ${'АБВГ'[q.answer]}</b><p>${e(q.explanation)}</p><div class="source-links"><a target="_blank" rel="noopener" href="https://zakon.rada.gov.ua/laws/show/1798-12#Text">Норми ГПК: ${e(q.article)}</a> <a target="_blank" rel="noopener" href="${e(q.source||'https://supreme.court.gov.ua/')}">${(q.source||'').includes('/Review/')?'Постанова Верховного Суду в ЄДРСР':'Офіційний матеріал Верховного Суду'}</a></div></div>`:''}</div>`}
function main(){if(state)strategy();if(!state){let isJoining=false;const saved=state;state=makeState();state.teams.forEach((t,i)=>t.position=[0,10,20,30][i]??0);const boardPreview=board();state=saved;app.innerHTML=`<div class="landing-page"><div class="panel intro landing-intro"><div class="pill">Господарський процес • Командна стратегія</div><h1>Судовий процес стає грою.</h1><p>40 тематичних клітинок на основі ГПК та практики ВС, 3D-кубики, процесуальний капітал, юридичні практики, випадкові події та дуелі. У демоверсії 8 віртуальних учасників, тому можна почати одразу. Для справжнього підключення з різних телефонів потрібен окремий сервер.</p>${isJoining?`<h2>Долучитися до кімнати ${e(room)}</h2><label>Ім’я учасника</label><input id="name" maxlength="36" placeholder="Введіть ваше ім’я"><div class="actions"><button class="primary" id="join">Приєднатися</button><button class="secondary" id="back">На головну</button></div>`:`<div class="actions"><button class="primary" id="create">🎲 Почати демонстраційну гру</button><button id="joinExisting">Увійти за кодом</button></div><div id="joinArea" class="hidden"><label>Код кімнати</label><input id="code" maxlength="6" placeholder="Наприклад, X7K2QP"><button id="go">Перейти</button></div>`}<p class="error">${e(err)}</p></div>${boardPreview}</div>`;$('#create')?.addEventListener('click',async()=>{if(await api('create')){history.replaceState(null,'','?room='+room);main()}});$('#joinExisting')?.addEventListener('click',()=>$('#joinArea').classList.toggle('hidden'));$('#go')?.addEventListener('click',()=>{let c=$('#code').value.trim().toUpperCase();if(c){room=c;history.replaceState(null,'','?room='+room);main()}});$('#back')?.addEventListener('click',()=>{room='';history.replaceState(null,'',location.pathname);main()});$('#join')?.addEventListener('click',async()=>{if(await api('join',{name:$('#name').value})){joined=true;main()}});wireCells();return}
$('#roomLabel').textContent='Кімната '+room+' • '+(state.host?'Тренер':'Учасник');let host=state.host;let current=state.teams[state.turn];let questionHTML=question();if(!host){app.innerHTML=`<div class="phone col">${header()}<div class="panel"><h3 style="margin:2px 0">${e(state.you?.name||'Учасник')}</h3><p class="hint">${state.you?.team!=null?`Ваша команда: <b style="color:${state.teams[state.you.team].color}">${e(state.teams[state.you.team].name)}</b>`:'Очікуйте розподілу на команди'}</p>${state.phase==='lobby'?`<div class="callout">Ви приєдналися. Тренер розпочне гру після формування команд. Учасників: ${state.players.length}.</div>`:state.phase==='finished'?`<h2>🏆 Гру завершено!</h2>`:`<div class="callout">Зараз ходить команда: <b>${e(current.name)}</b><br>Раунд ${state.round+1} з ${state.settings.maxRounds}</div>`}</div>${questionHTML}<div class="panel"><h3>Рейтинг команд</h3>${teamCards()}</div>${board()}<p class="error">${e(err)}</p></div>`;wireVotes();wireCells();return}
app.innerHTML=`<div class="game-shell">${board()}<div class="game-sidebar game-lower"><div class="col"><div class="panel"><div class="headerline"><h3 style="margin:0">Рейтинг команд</h3><span class="pill">${state.players.length} учасників</span></div>${teamCards()}</div></div><div class="col"><div class="panel"><div class="headerline"><h3 style="margin:0">Панель тренера</h3><span class="pill">${e(state.phase)}</span></div>${state.phase==='lobby'?`<p class="hint">Це демонстраційний режим: усі 8 учасників віртуальні. Виберіть кількість команд і натисніть «Розподілити й розпочати». Посилання на цю демоверсію можна відкрити на будь-якому пристрої, але голосування між різними пристроями тут не синхронізується.</p><div class="notice">Лише для ознайомлення. Віртуальні команди, без мережевого підключення.</div><div id="qr" style="display:none"></div><div class="controls"><button id="copy">Копіювати посилання на демогру</button></div><label>Кількість команд</label><select id="teamsNum">${[2,3,4,5,6].map(x=>`<option ${x===state.teamCount?'selected':''}>${x}</option>`).join('')}</select><label>Розподіл</label><select id="mode"><option value="random" ${state.settings.mode==='random'?'selected':''}>Випадково</option><option value="manual" ${state.settings.mode==='manual'?'selected':''}>Вручну</option></select><label>Кількість раундів</label><select id="rounds">${[3,5,8,12,16,20,30].map(x=>`<option ${x===state.settings.maxRounds?'selected':''}>${x}</option>`).join('')}</select><div class="controls"><button id="config">Застосувати налаштування</button><button class="primary" id="start">Розподілити й розпочати</button></div><p class="hint">Учасники віртуальні. Непризначених система розподілить випадково при старті.</p>`:state.phase==='finished'?`<h2>🏆 Партія завершена</h2><p>Переможці: <b>${e([...state.teams].sort((a,b)=>b.points-a.points)[0].name)}</b></p><button id="reset">Нова партія</button>`:`<div class="turn">Хід команди «${e(current.name)}»</div><div class="hint">Раунд ${state.round+1} із ${state.settings.maxRounds}</div><div class="controls">${state.phase==='roll'?`<button class="primary" id="roll">🎲 Кинути кубики</button>`:''}${state.phase==='voting'?`<button class="primary" id="reveal">Завершити голосування</button>`:''}${state.phase==='result'?`<button class="primary" id="next">Наступний хід</button>${buyable(current.position)&&state.ownership[current.position]===undefined&&current.laps>=1&&current.capital>=price(current.position)?`<button id="buy">🏛 Купити практику: ${price(current.position)} ПК</button>`:''}`:''}<button class="secondary" id="reset">Почати заново</button></div>`}<p class="error">${e(err)}</p></div>${state.notice?`<div class="event-banner">${e(state.notice)}</div>`:''}${challengePanel()}${state.phase==='lobby'?`<div class="panel"><h3>Учасники (${state.players.length})</h3><div class="people">${state.players.length?state.players.map(p=>`<div class="person"><span>● ${e(p.name)}</span><select class="assign" data-player="${e(p.id)}"><option value="">Без команди</option>${state.teams.map((t,i)=>`<option value="${i}" ${p.team===i?'selected':''}>${e(t.name)}</option>`).join('')}</select></div>`).join(''):'Поки нікого немає'}</div></div>`:''}${questionHTML}<div class="panel"><h3>Журнал гри</h3>${state.logs.slice().reverse().map(x=>`<div class="log">${e(x)}</div>`).join('')}</div></div></div></div>`;
const stageDock=$('#stageActionDock');if(stageDock){for(const id of ['roll','start','next','reveal']){const control=$('#'+id);if(control)stageDock.append(control)}}
for(let op of ['start','roll','reveal','next','reset','buy'])$('#'+op)?.addEventListener('click',async()=>{if(op==='reset'&&!confirm('Скинути партію та почати заново?'))return;if(op==='roll'){await animatedRoll();return}await api(op);main()});document.querySelectorAll('[data-challenge]').forEach(b=>b.addEventListener('click',async()=>{await api('challenge',{team:Number(b.dataset.challenge)});main()}));document.querySelectorAll('[data-objection]').forEach(b=>b.addEventListener('click',async()=>{await api('objection',{choice:Number(b.dataset.objection)});main()}));$('#dismissChallenge')?.addEventListener('click',async()=>{await api('dismissChallenge');main()});$('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText(link()).then(()=>{$('#copy').textContent='Скопійовано ✓'}));$('#config')?.addEventListener('click',async()=>{await api('configure',{count:Number($('#teamsNum').value),mode:$('#mode').value,maxRounds:Number($('#rounds').value)});main()});document.querySelectorAll('.assign').forEach(el=>el.addEventListener('change',async()=>{if(el.value!==''){await api('assign',{player:el.dataset.player,team:Number(el.value)});main()}}));if(false){}wireVotes();wireCells();}

const DIE_FACES=[1,2,3,4,5,6];
function dieCube(value,rolling=false){const orient={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]}[value]||[0,0];return `<div class="die-shell"><div class="die-cube ${rolling?'rolling':''}" style="--rx:${orient[0]}deg;--ry:${orient[1]}deg">${DIE_FACES.map((n,i)=>`<div class="die-face f${n}">${'<span class="pip"></span>'.repeat(n)}</div>`).join('')}</div></div>`}
function diceVisual(values,rolling=false){return `<div class="dice-scene" aria-label="Кубики: ${values.join(' і ')}">${dieCube(values[0],rolling)}${dieCube(values[1],rolling)}</div>`}
async function animatedRoll(){const b=$('#roll');if(!b||loading)return;loading=true;b.disabled=true;b.textContent='🎲 Кубики котяться…';const center=$('.centerboard');if(center){const el=document.createElement('div');el.className='dice-overlay';el.innerHTML=`<div class="dice-caption">Команда «${e(state.teams[state.turn].name)}» кидає кубики</div>${diceVisual([1,3],true)}<div class="dice-caption muted">Кидок у процесі…</div>`;center.append(el)}
await new Promise(resolve=>setTimeout(resolve,1650));const ok=await api('roll');if(ok){const overlay=$('.dice-overlay');if(overlay){overlay.innerHTML=`<div class="dice-caption">Випало ${state.dice[0]} + ${state.dice[1]} = ${state.dice[0]+state.dice[1]}</div>${diceVisual(state.dice)}<div class="dice-caption muted">${e(state.spaces[state.teams[state.turn].position])}</div>`;await new Promise(resolve=>setTimeout(resolve,1050))}}loading=false;main()}
function wireCells(){document.querySelectorAll('[data-cell]').forEach(el=>{const preview=()=>{let n=Number(el.dataset.cell),q=DATA_Q[n];if(!q)return;const modal=document.createElement('div');modal.className='cell-modal';modal.innerHTML=`<div class="panel preview-card"><button class="modal-close" aria-label="Закрити">✕</button><div class="pill">Клітинка ${n} · ${e(label(n))}</div><h3>${e(q[0])}</h3><p class="hint">Під час гри команда отримає чотири варіанти відповіді. Правильна відповідь відкриється лише після голосування.</p><div class="source-links"><a target="_blank" rel="noopener" href="${e(q[5])}">Перевірити джерело</a></div></div>`;document.body.append(modal);modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.closest('.modal-close'))modal.remove()})};el.addEventListener('click',preview);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();preview()}})})}

function wireVotes(){document.querySelectorAll('[data-vote]:not(:disabled)').forEach(b=>b.addEventListener('click',async()=>{await api('vote',{answer:Number(b.dataset.vote)});main()}))}
async function init(){if(room){token=localStorage.getItem(storageKey(room))||'';if(token){let success=await api('state');if(!success){token='';state=null;err=''}}}main()}
init();
</script></body></html>
