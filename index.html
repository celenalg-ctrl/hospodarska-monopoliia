const special=i=>!!EVENT[i], label=i=>EVENT[i]?.name||DATA_SPACES[i], buyable=i=>![0,6,9,12,18,19,25,29,39].includes(i), price=i=>250+50*Math.floor(i/8);
function strategy(){if(!state)return;state.ownership??={};state.notice??='';state.challenge??=null;state.teams.forEach((t,i)=>{t.capital??=500;t.knowledge??=0;t.cards??=1;t.laps??=0;t.skip??=0;t.purchased=holdings(i);t.assets=t.purchased.length;t.symbol??=DATA_SYMBOLS[i];if(i===1&&t.name==="Касація")t.name="Прецедент";if(i===2&&t.name==="Арбітри")t.name="Вердикт";if(i===1&&t.symbol==="🏛️")t.symbol="📜";if(i===2&&t.symbol==="📜")t.symbol="🔨"})}
function active(){return state.teams[state.turn]}

// Вартість придбаних практик залишається у власності команди та враховується у фінальному рейтингу.
function holdings(i){return Object.keys(state.ownership||{}).map(Number).filter(cell=>state.ownership[cell]===i).sort((a,b)=>a-b)}
function holdingsValue(i){return holdings(i).reduce((sum,cell)=>sum+price(cell),0)}
function finalScore(i){const t=state.teams[i];return (t.points||0)+Math.round(((t.capital||0)+holdingsValue(i))*.5)}
function scoreRanking(){return state.teams.map((t,i)=>({t,i,total:finalScore(i)})).sort((a,b)=>b.total-a.total||b.t.points-a.t.points||b.t.capital-a.t.capital)}
function assetCanBuy(){if(!state||state.phase!=='result'||!state.question||state.question.outcome!=='correct')return false;const i=active().position;return buyable(i)&&state.ownership[i]===undefined&&active().capital>=price(i)}
function assetOffer(){if(!state||state.phase!=='result'||!buyable(active().position))return '';const i=active().position,owner=state.ownership[i],t=active();if(owner!==undefined)return '<div class="asset-offer asset-existing"><strong>🏛 Практика «'+e(label(i))+'» має власника</strong><p>Власник: <b style="color:'+state.teams[owner].color+'">'+e(state.teams[owner].name)+'</b>. За помилку тут сплачується до 100 ПК власнику.</p></div>';
return '<div class="asset-offer"><div class="asset-offer-heading">🏛 Вільна юридична практика</div><strong>'+e(label(i))+'</strong><div class="asset-offer-prices"><span>Ціна: <b>'+price(i)+' ПК</b></span><span>Ваш капітал: <b>'+t.capital+' ПК</b></span></div><p>Придбання закріплює клітинку за командою, створює можливість отримувати платежі від суперників і додає її вартість до фінального результату.</p>'+(state.question.outcome==='correct'?(t.capital>=price(i)?'<button id="buy" class="primary asset-purchase-button">🏛 Придбати за '+price(i)+' ПК</button><span class="asset-small-note">Або натисніть «Наступний хід», щоб відмовитися.</span>':'<span class="asset-small-note">Недостатньо ПК для придбання. Потрібно ще '+(price(i)-t.capital)+' ПК.</span>'):'<span class="asset-small-note">Для придбання потрібно правильно відповісти на питання цієї клітинки.</span>')+'</div>'}
function assetPortfolio(){if(!state)return '';return '<section class="asset-portfolio"><div class="portfolio-head"><strong>🏛 Портфелі команд</strong><span>Оцінка активів і підсумковий рейтинг</span></div><div class="portfolio-grid">'+state.teams.map((t,i)=>{const cells=holdings(i),value=holdingsValue(i);return '<div class="portfolio-card" style="--portfolio-color:'+t.color+'"><div class="portfolio-title"><span class="portfolio-dot"></span><b>'+e(t.name)+'</b><span>'+cells.length+' практик</span></div><div class="portfolio-metrics"><span>◈ '+t.capital+' ПК</span><span>🏛 '+value+' ПК активів</span><span>★ '+finalScore(i)+' підсумок</span></div><div class="portfolio-list">'+(cells.length?cells.map(cell=>'<button type="button" data-asset-cell="'+cell+'" class="owned-list-item">'+e(label(cell))+' · '+price(cell)+' ПК</button>').join(''):'<span class="portfolio-empty">Практик поки немає</span>')+'</div></div>'}).join('')+'</div><div class="portfolio-note">Підсумок = бали компетентності + 50% залишку ПК + 50% вартості активів. Вартість придбаної практики не зникає, а переходить із грошового балансу у власність.</div></section>'}
function assetDetail(cell){const owner=state?.ownership?.[cell];const t=owner!==undefined?state.teams[owner]:null;return '<div class="asset-details"><div class="asset-detail-price">🏛 '+e(label(cell))+' · '+price(cell)+' ПК</div><p>'+(t?'<b style="color:'+t.color+'">Власник: '+e(t.name)+'</b>. Вартість практики: '+price(cell)+' ПК. За неправильну відповідь гостя власник отримує до 100 ПК.':'Вільна практика. Її може придбати команда, яка потрапила на клітинку та правильно відповіла, якщо має '+price(cell)+' ПК.')+'</p></div>'}

function objection(cell){if([5,14,15,16].includes(cell))return ["Чому експертний висновок має безумовну перевагу над рештою доказів?","Чи потребує встановлення відповідної обставини спеціальних знань та чи відповідає експертиза умовам ст. 99 ГПК?","Чому достатньо лише заперечення другої сторони для недопустимості експертизи?","Чому суд не вправі перевіряти висновок експерта?",1];if([33,34,35].includes(cell))return ["Чому кожну скаргу треба розглянути без перевірки строків?","Чому касація завжди переоцінює всі докази?","Чи виконані умови оскарження, строки та визначені ГПК підстави перегляду?","Чому апеляційна скарга не потребує процесуального обґрунтування?",2];return ["Чи відповідає дія строкам, вимогам ГПК, правам учасників і засадам змагальності?","Чому кожне клопотання має автоматично задовольнятися?","Чому суд повинен самостійно збирати докази замість сторін?","Чому будь-яке заперечення автоматично призводить до закриття провадження?",0]}
function challengePanel(){if(state?.phase==='duel_pick'){return '<div class="challenge-panel"><h3>⚔ Процесуальна дуель</h3><p>Команда «'+e(active().name)+'» потрапила на поле дуелі. Оберіть суперника, який заявить мотивоване заперечення. Після цього активна команда захищає свою позицію.</p><div class="controls">'+state.teams.map((t,i)=>i===state.turn?'':'<button data-duel-target="'+i+'">Викликати «'+e(t.name)+'»</button>').join('')+'</div><p class="hint">У демоверсії тренер виконує дії обох команд на одному пристрої.</p></div>'}
if(state?.phase==='objection'&&state.challenge){let o=objection(active().position);return '<div class="challenge-panel"><h3>⚔ Мотивоване заперечення</h3><p>Команда «'+e(state.teams[state.challenge.from].name)+'» використовує картку. Яке заперечення найбільш юридично обґрунтоване?</p>'+o.slice(0,4).map((v,i)=>'<button class="challenge-choice" data-objection="'+i+'">'+('АБВГ'[i])+'. '+e(v)+'</button>').join('')+'</div>'}
if(state?.phase==='voting'&&!state.eventType&&!state.challenge&&!state.question?.answered&&!state.dismissChallenge){let options=state.teams.map((t,i)=>({t,i})).filter(x=>x.i!==state.turn&&x.t.cards>0);if(options.length)return '<div class="challenge-panel"><h3>⚔ Вікно процесуального виклику</h3><p class="hint">У демоверсії тренер запускає виклик від імені суперників. Кожна картка одноразова.</p><div class="controls">'+options.map(x=>'<button data-challenge="'+x.i+'">⚔ '+e(x.t.name)+' ('+x.t.cards+')</button>').join('')+'<button id="dismissChallenge" class="secondary">Не застосовувати</button></div></div>'}
return state?.challenge?'<div class="event-banner">⚔ Команда «'+e(state.teams[state.challenge.from].name)+'» заявила '+(state.challenge.valid?'обґрунтоване':'необґрунтоване')+' заперечення. Тепер захистіть позицію.</div>':''}

const ALT_SCENARIOS=["Позивач повторно звертається з тією самою вимогою після повернення першої заяви, цього разу додавши всі відсутні документи. Чи зберігається дата первісного подання?","Кредитор заявляє вимогу до фізичної особи-гаранта, яка забезпечувала господарський договір між двома компаніями. Як визначити судову юрисдикцію?","Заяву від товариства підписала особа, посада й довіреність якої не підтверджені жодним додатком. Які процесуальні наслідки має перевірити суд?","Після завершення обміну заявами по суті сторона додає новий документ під назвою «пояснення», що фактично змінює її доводи. Як оцінити таке звернення?","Фізична особа оскаржує рішення та заявляє про неспівмірність судового збору її доходам. Які критерії враховує суд при вирішенні клопотання?","В обґрунтування поставки подано фотографії переписки без вихідних файлів, а інший учасник заперечує автентичність. Який підхід до доказування є правильним?","Команда володіє аналітичною практикою. Її опонент вважає висновок експерта доказом, який суд повинен прийняти без оцінки. Яке рішення правомірне?","Учасник пропустив строк апеляційного оскарження і подав клопотання, що містить лише судові цитати без опису обставин пропуску. Чи достатньо цього?","Після застосування забезпечення позову відповідач заявив про ризик значної майнової шкоди. Яким процесуальним інструментом це питання вирішується?","Сторони подали проект мирової угоди, яка визначає взаємні поступки та порядок виконання. Який процесуальний підхід до її затвердження?","Після відкриття справи за належною територіальною підсудністю до спору залучено ще одного відповідача. Чи змінює це автоматично суд?","Позов підприємства подає ліквідатор через свій кабінет, однак у підприємства кабінет не зареєстрований. Чи усуває це порушення обов’язку самої юридичної особи?","Позивач вдруге звернувся з тотожною вимогою після залишення попередньої заяви без розгляду. Відповідач вважає сам факт повторення зловживанням. Яка оцінка?","У підготовчому засіданні сторона вперше заявляє про витребування документів і не пояснює, чому не зробила цього вчасно. Що повинен врахувати суд?","Свідок виклав показання в письмовій заяві, але опонент просить особистого допиту. Як вирішується питання про виклик свідка?","Дві сторони подали суперечливі акти виконаних робіт і заперечують достовірність документів одна одної. Яким є належний спосіб оцінки доказів?","Експертна установа повідомила про неможливість виконати дослідження в розумний строк; сторона пропонує іншу кваліфіковану установу. Як діяти суду?","Учасник просить компенсувати транспорт і проживання представника, який прибув на слухання з іншої області. За якими правилами оцінюються витрати?","Замовлений стороною висновок експерта не містить обов’язкового процесуального застереження щодо використання у суді. Як його оцінити?","Провадження зупинено на час проведення експертизи. Сторона твердить, що справа остаточно припинена. Чи обґрунтована така позиція?","Відповідач назвав нові заперечення «уточнюючими поясненнями» і подав їх після встановленого строку без дозволу суду. Які наслідки?","Відзив надійшов до суду, проте відповідач не підтвердив надсилання його копії позивачу та третій особі. Що має значення для процесуальної оцінки?","Позивач не надіслав копію процесуального документа юридичній особі, посилаючись на її обов’язок зареєструвати електронний кабінет. Який підхід ГПК?","Після завершення строку подання відзиву відповідач заявив зустрічний позов і просить прийняти його лише з мотивів процесуальної економії. Яке рішення?","У межах банкрутства виник окремий спір, який за предметом потребує загального позовного провадження. Чи визначає справу лише факт її зв’язку з банкрутством?","Учасники подали мирову угоду з положеннями про строки добровільного виконання. Як розмежувати затвердження угоди й розстрочення виконання?","Під час врегулювання спору за участю судді сторона просить суддю наперед визначити, чи виграє вона спір. Чи відповідає це процедурі?","У клопотанні про експертизу сторона просить експерта вирішити, чи є договір недійсним за законом. Які межі експертного дослідження?","Представник просить відкласти слухання без належних підстав та робить це повторно. Чи повинен суд автоматично задовольнити прохання?","Сторона заявляє про компенсацію витрат на адвоката, проте інший учасник вважає заявлену суму неспівмірною. Які критерії судової оцінки?","Суд не вирішив питання про судові витрати в резолютивній частині рішення. Яким процесуальним шляхом можна усунути цю неповноту?","Поки суд розглядав заяву про додаткове рішення щодо витрат, апеляційний суд скасував основне рішення. Які наслідки для заяви?","Після ухвалення рішення позивач заявив нову вимогу, назвавши її «виправленням описки». Які можливості суду в такій ситуації?","Апеляційний суд виявив порушення предметної юрисдикції, хоча скаржник цього не зазначив. Чи обмежений суд доводами скарги?","Касатор доводить, що апеляція не застосувала процесуальний висновок Верховного Суду в подібних правовідносинах. За яких умов це є підставою перегляду?","Сторона посилається на постанову Верховного Суду, ухвалену вже після набрання чинності рішенням, і називає її нововиявленою обставиною. Чи правильно?","Боржник просить розстрочити виконання рішення на тривалий строк, посилаючись на фінансові складнощі. Які обставини оцінює суд?","Після подання скарги на виконавця скаржник змінив позицію і заявив про відмову. Які процесуальні наслідки та межі її прийняття?","Боржник у передбачений законом строк подав заяву про скасування судового наказу. Як має діяти суд?","На завершенні гри команда доводить, що змагальність дозволяє суду допомагати їй збирати докази замість опонента. Яка позиція відповідає засадам ГПК?"];
const ADVANCED_CASES=[[8,"Позивач до подання позову просить заборонити відчуження спірної нерухомості. Суддя розглянув заяву; після подання позову автоматизована система визначила іншого суддю. Який процесуальний підхід відповідає висновку КГС ВС?",["Позов розподіляється повторно, якщо заява про забезпечення розглядалася до відкриття провадження.","Позов передається раніше визначеному судді як складова тієї самої судової справи.","Повторний розподіл допускається за згодою сторін, якщо забезпечення вже виконано.","Визначеного суддю зберігають лише тоді, коли заява про забезпечення задоволена."],1,"Розгляд заяви до подання позову та самого позову становить одну справу; призначення нового судді створює проблему реалізації ст. 145 ГПК щодо скасування забезпечення.","136–145","125589273",2025,"910/12847/23"],[8,"Кредитор просить арештувати кошти за позовом про їх стягнення. Суд вимагає підтвердити спеціальним документом, що боржник юридично здатний розпорядитися своїм рахунком. Як оцінити такий критерій доказування?",["Можливість розпорядження коштами враховується як очевидна обставина; проте суд окремо оцінює достатність обґрунтування ризику й співмірність заходу.","Обмеження допустиме лише якщо банк підтвердив підготовку до конкретного переказу.","Право розпоряджатися коштами саме по собі замінює перевірку предмета спору і співмірності арешту.","Потрібен доказ уже здійсненого виведення коштів, інакше забезпечення суперечить ст. 136 ГПК."],0,"У постанові КГС ВС 10.09.2025 підкреслено неприпустимість завищеного стандарту щодо очевидної можливості розпорядження майном. Це не усуває оцінювання зв'язку із позовом та балансу інтересів.","136, 137","130129655",2025,"907/523/25"],[8,"Позов про стягнення 2 млн грн перебуває в апеляції. Сторона просить накласти арешт, посилаючись на нові ризики невиконання майбутнього рішення. Чи вправі апеляційний суд вирішувати заяву?",["Лише за умови попереднього відхилення тотожної заяви судом першої інстанції.","Так, забезпечення можливе і на стадії апеляційного провадження за наявності передбачених законом підстав.","Ні, після рішення першої інстанції питання забезпечення належить лише до компетенції виконавця.","Так, але лише в разі коли апеляційний суд одночасно зупиняє виконання оскарженого рішення."],1,"ГПК дозволяє забезпечення на різних стадіях розгляду, зокрема під час апеляції. Потрібно дотримуватися процесуальних умов і перевірити необхідність заходу.","136, 137","126534612",2025,"904/5647/24"],[8,"Після подання апеляційної скарги на ухвалу про забезпечення до апеляційного суду надіслали лише копії окремих документів. Позивач подав нову заяву про забезпечення, хоча рішення по суті ще не ухвалене. Яка оцінка повноважень апеляції?",["Копій достатньо, якщо сторони підтверджують їх тотожність оригіналам.","Апеляція може вжити заходів, коли погоджено апелянта і заявника, незалежно від стадії справи.","Наявність відкритого апеляційного провадження щодо ухвали сама собою надає повні повноваження щодо нового забезпечення.","Розгляд забезпечення апеляцією за такої ситуації не підмінює повноважень суду першої інстанції; необхідні належна стадія та матеріали справи."],3,"Сам факт оскарження проміжної ухвали і передання копій матеріалів не означає, що апеляція вже вправі розглядати нову заяву про забезпечення замість суду першої інстанції.","136, 137, 145","126534612",2025,"904/5647/24"],[8,"Забезпеченням позову про стягнення боргу арештовано і кошти, і майно відповідача в сукупних межах заявленої суми. Боржник стверджує, що одночасна згадка обох видів активів завжди означає подвійне забезпечення. Що має вирішальне значення?",["Те, чи вказано в ухвалі один або два різновиди майна.","Те, чи є грошові кошти самостійним об'єктом цивільних прав.","Фактичний обсяг обмежень, спільний граничний розмір і співмірність заходу вимогам, а не лише перелік видів активів.","Те, чи відповідач погодився на арешт хоча б одного виду майна."],2,"Необхідно розрізняти загальний арешт у межах однієї суми вимог і подвійне забезпечення, коли кожен вид активів окремо арештовано на повну суму без належного обмеження.","136, 137","129582421",2025,"759/22148/24"],[8,"Позивач просить зупинити продаж арештованого майна, але предметом його позову є недійсність результатів електронних торгів, а не визнання права власності та зняття арешту. Який аргумент є визначальним?",["Зупинення реалізації за п. 6 ч. 1 ст. 137 ГПК пов'язане з передбаченим цією нормою видом позову, а не з будь-яким оскарженням аукціону.","Зупинення продажу допустиме за будь-яким речовим позовом, якщо об'єктом є арештоване майно.","Суд може застосувати цей захід після внесення суми, тотожної вартості майна.","Застосування заходу залежить лише від доведення незаконності оцінки майна."],0,"ОП КГС ВС розмежувала спеціальний захід у спорі про визнання права власності й зняття арешту та позови щодо результатів торгів.","137","111739159",2023,"910/5361/22"],[8,"До господарського суду подано позов про право на гуртожиток. У заяві про забезпечення прокурор пояснив, що без арешту спірного об'єкта можливе його відчуження. Як перевіряти адекватність такого заходу?",["Виходити лише з вартості гуртожитку порівняно з розміром судового збору.","Порівняти зв'язок арешту з предметом вимоги, ризик для реалізації рішення та наслідки обмеження прав інших осіб.","Вимагати від прокурора доказу вже укладеного договору відчуження з третьою особою.","Відмовити, якщо предметом спору є право власності, а не стягнення грошей."],1,"Співмірність оцінюється з огляду на предмет позову, майнові наслідки та баланс інтересів; у спорі про право власності арешт об'єкта може прямо відповідати меті забезпечення.","136, 137","108025267",2022,"911/121/22"],[8,"На забезпечення позову накладено арешт на іпотечне майно відповідача. Іпотекодержатель заявляє, що будь-який арешт автоматично змінює його черговість задоволення. Чи обґрунтована позиція?",["Так, арешт має пріоритет над попередньою іпотекою до скасування ухвали.","Ні, арешт обмежує відчуження власником, але не скасовує іпотеку та законну пріоритетність вимог іпотекодержателя.","Черговість зберігається тільки після письмової згоди іпотекодержателя на арешт.","Іпотека припиняється, якщо арешт забезпечує вимоги іншого кредитора."],1,"Правові наслідки арешту іпотечного майна не тотожні припиненню іпотеки або зміні черговості забезпечених вимог.","136, 137","127423114",2025,"466/2651/23"],[8,"Суд першої інстанції відмовив у забезпеченні немайнового позову, оскільки майбутнє рішення не передбачатиме примусового стягнення. Який критерій треба було врахувати?",["Лише імовірність відчуження майна відповідача до рішення.","Наявність можливості звернути майбутнє рішення до примусового виконання.","Імовірність істотного ускладнення ефективного захисту чи поновлення оспорюваного права без заходу.","Співвідношення суми судового збору з економічними наслідками заходу."],2,"Для немайнових вимог забезпечення може бути потрібним для ефективного захисту права, навіть якщо спосіб захисту не зводиться до грошового виконання.","136, 137","120770496",2024,"910/211/24"],[4,"Сторона збільшила суму грошових вимог, додавши заборгованість за новий період, проте судовий збір доплатила виходячи зі старого максимуму. Як визначити належну доплату?",["Із суми збільшення за ставкою, яка діяла на день подання первісної заяви, без урахування вже сплаченого.","З урахуванням нового предмета та ціни позову, установленої максимальної ставки на дату заяви про збільшення і вирахуванням уже сплаченого.","У розмірі повної ставки за новим позовом без вирахування попередньо сплаченого збору.","За результатом остаточного розгляду справи, оскільки до рішення доплата не потрібна."],1,"За висновком КГС ВС у разі нових сум за нові періоди розрахунок доплати враховує актуальні межі ставки та раніше сплачений збір.","Закон «Про судовий збір», ст. 4; ГПК, 163","106976099",2022,"910/18639/21"],[4,"Після ухвалення рішення касатор посилається виключно на недоплату судового збору при збільшенні позовних вимог. Чи достатньо цього для скасування рішення по суті?",["Так, порушення фіскального обов'язку автоматично нівелює законність рішення.","Ні, недоплата збору сама собою не є безумовною підставою для скасування рішень по суті спору.","Так, якщо доплата не здійснена до закінчення підготовчого провадження, незалежно від інших обставин.","Ні, але лише за умови, що суд у резолютивній частині прямо поклав збір на відповідача."],1,"КГС ВС відмежував порушення правил сплати збору від безумовних підстав скасування судового рішення по суті.","Закон «Про судовий збір»; ГПК, 277, 310","106976099",2022,"910/18639/21"],[4,"Адвокат подав апеляційну скаргу через систему «Електронний суд», однак збір обчислено без понижуючого коефіцієнта. Який підхід відповідає висновку Великої Палати?",["Коефіцієнт не застосовується, якщо поданий документ підписаний КЕП.","Пониження можливе лише після ухвалення окремого процесуального рішення суду про електронну форму.","Особа, яка подає процесуальний документ в електронній формі через відповідну систему, має законне очікування застосування понижуючого коефіцієнта.","Використання системи впливає лише на спосіб підтвердження сплати, а не на розмір ставки."],2,"ВП ВС у 2022 році підтвердила правомірні очікування застосування коефіцієнта за подання через «Електронний суд».","Закон «Про судовий збір», ст. 4","107706741",2022,"916/228/22"],[17,"Сторона до закінчення дебатів усно повідомила, що докази правничих витрат подасть після рішення. Суд вимагає окремої письмової заяви, поданої ще в підготовчому засіданні. Який підхід правильний?",["У ГПК немає вимоги лише письмової форми або конкретної попередньої стадії для такого повідомлення; важливий граничний момент до завершення дебатів.","Заява дійсна тільки якщо її подано з першою заявою по суті та із попереднім розрахунком.","Повідомлення про майбутнє подання доказів не допускається усно, навіть якщо зафіксоване у протоколі.","Суд може прийняти повідомлення після дебатів, якщо інша сторона не заперечує."],0,"Огляд відображає практику 2024 року: спеціальних вимог до письмової форми цієї заяви немає, проте її слід зробити своєчасно.","129","120770513",2024,"921/403/22"],[17,"Сторона заявила про намір стягнути витрати на адвоката, але докази подала після спливу встановленого строку і не просила його поновити. Яка процесуальна дія відповідає практиці КГС ВС?",["Відмовити у стягненні як недоведеної матеріальної вимоги без оцінки процесуального строку.","Залишити заяву щодо розподілу витрат без розгляду через пропуск строку без належного клопотання.","Покласти всі витрати на сторону, що пропустила строк, незалежно від результату спору.","Відкрити нове провадження щодо самостійної вимоги про відшкодування витрат."],1,"Несвоєчасне подання доказів без клопотання про поновлення строку зумовлює залишення відповідної заяви без розгляду.","129, 221, 244","118294356",2024,"907/568/22"],[17,"Після рішення сторона заявила про ухвалення додаткового рішення щодо витрат на адвоката. Однак до завершення дебатів вона не заявляла наміру вимагати відшкодування цих витрат. Що відрізняє цю ситуацію від несвоєчасного подання доказів?",["Відсутність своєчасної заяви про відшкодування є підставою відмовити в додатковому рішенні щодо цих витрат, а не просто оцінити нові докази.","Належна дія суду завжди однакова: залишити заяву без розгляду незалежно від того, чи була попередня заява.","Заява про додаткове рішення допустима, якщо рішення вигідне заявникові, незалежно від повідомлень до дебатів.","Суд може компенсувати витрати в повному обсязі за відсутності заперечень іншої сторони."],0,"У практиці КГС ВС розмежовано наслідки неподання своєчасної заяви про відшкодування витрат і неподання підтвердних документів у строк.","129, 221, 244","118294356",2024,"907/568/22"],[17,"У спрощеному провадженні без судових дебатів сторона заявляє, що порядок подання доказів адвокатських витрат не обмежений строками через відсутність дебатів. Який висновок найбільш обґрунтований?",["У спрощеному провадженні докази витрат допускаються до подання виконавчого документа.","Вимоги до строків подання доказів витрат зберігають застосування і в спрощеному провадженні; відсутність дебатів не скасовує процесуальної дисципліни.","Відсутність дебатів означає обов'язок заявляти витрати виключно у відзиві.","У спрощеному провадженні компенсація витрат на професійну допомогу можлива лише за погодженням сторін."],1,"Підхід КГС ВС 2023 року поширює вимоги щодо строків і на справи без судових дебатів.","129, 221","111159719",2023,"910/13813/21"],[17,"Адвокатський акт виконаних робіт містить технічну помилку в даті, проте інші матеріали підтверджують фактичні послуги, їхній обсяг та зв'язок зі справою. Як має діяти суд?",["Відмовити лише через помилку, оскільки документ не може бути уточнений після рішення.","Оцінити всі документи в сукупності та визначити, чи заважає неточність установленню фактичних витрат.","Перенести питання суми компенсації на стадію виконання рішення.","Автоматично вважати будь-який акт бездоганним, якщо його підписали адвокат і клієнт."],1,"КГС ВС зазначив, що окремі неточності документів мають оціночний характер і самі собою не спростовують надання правничої допомоги.","126, 129","118922269",2024,"912/3033/19"],[17,"Сторона включила до заявленої компенсації окрему оплату адвокату за підготовку самої заяви про розподіл судових витрат. Яка актуальна для 2024 року позиція ОП КГС ВС?",["Такі витрати компенсуються як частина підготовки до розгляду спору, якщо передбачені договором.","Такі витрати не відшкодовуються: заява спрямована на подання доказів уже понесених витрат; ОП відступила від ранішого висновку.","Такі витрати компенсуються лише в разі ухвалення додаткового рішення про витрати.","Такі витрати компенсуються в межах п'яти відсотків від загального гонорару."],1,"Постанова ОП КГС ВС від 02.02.2024 у справі № 910/9714/22 змінила підхід до компенсації роботи з підготовки заяви про самі судові витрати.","126, 129","116828908",2024,"910/9714/22"],[17,"Компанія підтвердила юридичні консультації у справі договором із фахівцем, який не має статусу адвоката. Якою є правова кваліфікація заявлених сум саме як професійної правничої допомоги?",["Це професійна правнича допомога, якщо консультації потребували спеціальних правових знань.","Такі послуги відшкодовуються як адвокатські, якщо сторона погодила їхню ціну.","Послуги неадвоката не належать до професійної правничої допомоги для відповідної компенсації за правилами ГПК.","Статус надавача не має значення, якщо консультант отримав винагороду після рішення."],2,"ВП ВС 2022 та КГС ВС 2023 розмежували професійну правничу допомогу адвоката і юридичні послуги іншої особи.","16, 126","114020698",2023,"911/1235/22"],[17,"Сторона надала докази правничих витрат у справі із ціною позову 100 тис. грн, заявивши до компенсації 450 тис. грн. Суд вважає суму неспівмірною та не покладає її повністю на опонента. Що потрібно вмотивувати?",["Лише різницю між гонораром і ціною позову, оскільки інші критерії не мають значення.","Які конкретні витрати не підлягають відшкодуванню, чому та на якій правовій підставі, з оцінкою обставин справи й пропорційності.","Те, що договір сторони з адвокатом втратив чинність у частині надмірного гонорару.","Те, що компенсація адвокатського гонорару за законом не може перевищувати ціну позову."],1,"Суд має мотивувати конкретне обмеження компенсації та відрізняти договірні відносини клієнта з адвокатом від покладання витрат на опонента.","126, 129","117307157",2024,"910/6416/22"],[17,"Після апеляційного перегляду ухвали першої інстанції сторона заявляє окрему компенсацію правничих витрат, пов'язаних з оскарженням проміжної ухвали. Коли може оцінюватися їх розподіл?",["Витрати за проміжною ухвалою остаточно не підлягають відшкодуванню незалежно від результату спору.","Виключно одразу після апеляційної ухвали, без можливості подальшої оцінки.","Під час вирішення розподілу витрат за результатами розгляду спору по суті може оцінюватися і допомога під час перегляду проміжної ухвали.","Лише після остаточного виконання судового рішення."],2,"КГС ВС допускає дослідження розподілу відповідних витрат під час остаточного розподілу за результатом вирішення спору по суті.","123, 129","111484354",2023,"910/15830/20"],[5,"Позивач подав до суду паперову роздруківку листування. Суперник заперечує не форму роздруківки, а відповідність її змісту оригінальним електронним повідомленням; оригінал не надано. Яка процесуальна оцінка?",["Паперова копія автоматично набуває статусу письмового доказу після засвідчення адвокатом.","Паперова форма сама не робить доказ недопустимим, але за сумніву щодо відповідності оригіналу та його неподання суд може не брати копію до уваги.","Суд зобов'язаний прийняти копію без оцінки автентичності, бо електронна кореспонденція є загальнодоступною.","Достатньо нотаріального засвідчення роздруківки для усунення будь-яких сумнівів щодо первинних даних."],1,"Стаття 96 ГПК дозволяє паперові копії електронних доказів, однак зберігає значення оригіналу при обґрунтованих сумнівах у відповідності копії.","96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2026,"презентація ВС 12.03.2026"],[15,"Сторона подала файл листування з месенджера без КЕП. Опонент наполягає, що без електронного підпису будь-який цифровий доказ заборонено оцінювати. Який підхід відповідає практиці КГС ВС?",["КЕП вимагається від кожного повідомлення незалежно від виду комунікації.","Відсутність підпису завжди виключає достовірність повідомлення, але не його належність.","Електронний доказ є ширшим поняттям за електронний документ; відсутність КЕП сама собою не робить усі цифрові дані недопустимими.","Листування без КЕП може використовуватися тільки як показання свідка, але не як електронний доказ."],2,"КГС ВС розмежовує електронний документ та електронний доказ, зокрема повідомлення й дані, для яких підпис не завжди є умовою допустимості.","96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2026,"презентація ВС, справа 910/5408/21"],[15,"У справі досліджують комерційне листування між двома компаніями. Адреси й факт обміну листами сторони визнають, але одна заперечує авторство лише тому, що лист не підписаний КЕП. Що має встановити суд?",["Відсутність КЕП достатня для заперечення авторства будь-якого комерційного листа.","Слід оцінити сукупність обставин і достатність ідентифікації відправника, адже у звичайному діловому листуванні КЕП не є універсальною вимогою.","Визнання належності адреси автоматично доводить достовірність кожного твердження в листі.","Без нотаріального протоколу огляду електронної скриньки факт надсилання листа не може оцінюватися."],1,"Практика ВС враховує фактичний контекст листування й можливість ідентифікувати відправника, а не тільки факт накладення КЕП.","96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2026,"презентація ВС, справа 923/1379/20"],[5,"Учасник подав файл фотографії як електронний доказ, однак інший учасник заперечив час його створення. Який елемент цифрової інформації особливо важливий для перевірки такого заперечення?",["Візуальне розширення назви файлу, незалежно від фактичного формату.","Метадані, які можуть містити дату створення, зміни файлу та інші характеристики його походження.","Наявність надрукованого зображення з печаткою сторони.","Час завантаження копії у матеріали електронної судової справи як єдина дата виникнення доказу."],1,"Метадані допомагають установлювати цифровий контекст і автентичність, але оцінюються разом з іншими доказами.","96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2026,"презентація ВС 12.03.2026"],[5,"Сторона долучила електронне повідомлення, яке опонент вважає зміненим після відправлення. Який підхід до доказової сили цифрових даних коректний?",["Оцінювати автентичність, точність і цілісність з урахуванням конкретних заперечень та цифрових ознак, не надаючи формі автоматичної переваги чи недовіри.","Вважати оригінал електронного повідомлення достовірним незалежно від обґрунтованих доказів його зміни.","Відмовитися від оцінки повідомлення, якщо його неможливо відтворити в паперовому вигляді.","Вимагати однакового КЕП від відправника й отримувача для кожної форми електронного повідомлення."],0,"Сучасний підхід передбачає оцінку цілісності й достовірності електронних доказів з урахуванням конкретних заперечень, а не за формальним критерієм носія.","73, 86, 96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2026,"презентація ВС 12.03.2026"],[11,"Банкрутом визнано ТОВ; ліквідатор має зареєстрований електронний кабінет і подає всі документи самостійно. Чи усуває це обов'язок самого товариства мати кабінет?",["Так, адже після відкриття ліквідації ліквідатор повністю замінює юридичну особу для обміну документами.","Ні, обов'язок юридичної особи зберігається незалежно від кабінету ліквідатора, зокрема на випадок його заміни.","Так, якщо ліквідатор письмово повідомив суд, що документи товариства будуть зберігатися в його кабінеті.","Ні, але лише у справах, де боржник виступає позивачем."],1,"КГС ВС у вересні 2025 року підтвердив обов'язок юридичної особи-банкрута реєструвати власний електронний кабінет.","6","130552263",2025,"911/899/22 (911/3490/23)"],[11,"Юридична особа, зареєстрована за українським законом, вказує, що зобов'язання мати електронний кабінет виникло лише після її першого звернення до суду в 2024 році. Яке твердження відповідає законодавчій зміні?",["Обов'язок встановлено для всіх таких юридичних осіб з 04.11.2023, а не з першого процесуального звернення.","Обов'язок виникає тільки після відкриття першого провадження за участю юридичної особи.","Вирішальною є наявність у справі адвоката з електронним кабінетом.","Початок обов'язку визначається датою повідомлення про справу в судовому реєстрі."],0,"ОП КГС ВС 30.08.2024 роз'яснила чинність змін щодо обов'язкових електронних кабінетів для українських юридичних осіб з 04.11.2023.","6","121591790",2024,"908/3731/23"],[14,"Свідок надав засвідчену письмову заяву. Факти в ній узгоджуються з іншими матеріалами, а опонент просить викликати свідка лише тому, що він не був допитаний у засіданні. Який стандарт застосовується?",["Виклик є необхідною умовою оцінки будь-якої заяви свідка в господарському процесі.","Письмові показання підлягають оцінці без виклику; допит залежить від суперечностей або сумнівів у змісті, достовірності чи повноті.","Виклик можливий лише якщо обидві сторони погодилися на допит свідка.","Свідка не можна викликати після подання ним письмової заяви, оскільки доказ уже наданий."],1,"КГС ВС 2025 року визначив, що виклик не є обов'язковою передумовою оцінювання заяви свідка.","86–90","130129688",2025,"906/127/24"],[33,"Компанія, не залучена до справи, оскаржує рішення. У його мотивувальній частині прямо встановлено припинення її майнового права; у резолютивній частині компанію не згадано. Чи може вона мати право на апеляцію?",["Ні, право на апеляцію незалученої особи виникає лише за безпосереднього присуду в резолютивній частині.","Так, якщо суд безпосередньо вирішив питання про її право в мотивувальній або резолютивній частині; зв'язок має бути очевидним і безумовним.","Так, якщо компанія доведе будь-яку економічну зацікавленість у результаті спору.","Лише після заяви про перегляд за нововиявленими обставинами."],1,"КГС ВС визнає вирішальним прямий, очевидний і безумовний вплив судового рішення на право незалученої особи, у тому числі через мотивувальну частину.","17, 254","117176803",2024,"5023/3214/11"],[22,"Позивач посилається на те, що відповідач має обов'язковий електронний кабінет, проте його не зареєстрував. Як оцінювати обов'язки учасників щодо надсилання копій процесуальних документів?",["Нереєстрація кабінету автоматично прирівнюється до отримання відповідачем усіх документів суду й сторін.","Обов'язки з надсилання та наслідки нереєстрації визначаються спеціальними нормами ГПК з урахуванням статусу адресата й способу подання; їх не можна підміняти довільною презумпцією отримання.","Позивач за власним вибором звільняється від будь-якого підтвердження надіслання документів.","Суд зобов'язаний надсилати замість позивача всі додатки, якщо в адресата немає електронного кабінету."],1,"Правила електронного обміну й надсилання процесуальних документів потрібно застосовувати відповідно до конкретних умов статей 6, 42, 172 ГПК, а не за абстрактною презумпцією.","6, 42, 172","121591790",2024,"908/3731/23"],[23,"У справі про договір позивач заперечує залучення третьої особи як співвідповідача. Суд вважає, що її участь як відповідача полегшила б захист прав, і сам змінює її процесуальний статус. Яка оцінка?",["Суд може змінити статус за власною ініціативою, якщо це відповідає процесуальній економії.","Суд може змінити статус після попередження третьої особи та надання їй строку для відзиву.","Залучення співвідповідача належить до диспозитивних повноважень позивача; суд не вправі змінювати статус на власний розсуд без відповідного клопотання.","Зміна статусу допустима лише якщо третя особа вже подала письмові пояснення."],2,"Позиція КГС ВС 2024 року підкреслює виключне право позивача ініціювати залучення співвідповідача та неприпустимість заміни статусу третьої особи судом із власної ініціативи.","14, 48","122407022",2024,"914/2441/15 (914/2778/21)"]];
const EXTENDED_CASES=[[7,"У 2023 році підприємство пропустило процесуальний строк, пославшись у клопотанні тільки на загальний факт воєнного стану в Україні, не наводячи причин, що перешкодили своєчасній дії. Який висновок відповідає практиці КГС ВС?",["Дія воєнного стану автоматично зупиняє перебіг усіх процесуальних строків.","Поновлення можливе лише за заявою військової адміністрації про неможливість роботи суду.","Воєнний стан не є самодостатньою підставою: суд оцінює конкретні перешкоди та їх вплив на можливість вчинити дію.","Суд повинен поновити строк, якщо учасник перебуває у регіоні, внесеному до переліку територій бойових дій, без додаткової оцінки."],2,"КГС ВС відмежовує загальні обставини воєнного стану від конкретних об'єктивних причин пропуску строку.","119","109440763",2023,"910/17791/17"],[4,"Позивач подав до господарського суду заяву про забезпечення доказів. ГПК установлює вимоги до заяви, але Закон «Про судовий збір» не містить спеціальної ставки за таку заяву. Чи є обов'язок сплатити збір?",["Так, за аналогією слід застосувати ставку за забезпечення позову.","Так, у розмірі, який суд визначить із огляду на складність забезпечення доказів.","Ні, спеціальний Закон «Про судовий збір» не передбачає відповідної ставки, попри згадку обов'язку в ГПК.","Ні, але лише якщо заява подана до відкриття провадження."],2,"ОП КГС ВС 07.06.2024 застосувала пріоритет спеціального Закону «Про судовий збір», який не встановлює ставку за заяву про забезпечення доказів.","110–112; Закон «Про судовий збір», 4","119618089",2024,"918/907/22"],[31,"Провадження завершилося ухвалою про закриття справи, а питання судових витрат суд не вирішив. Яку процесуальну форму має застосувати суд для усунення цієї неповноти?",["Ухвалити додаткову ухвалу, оскільки основний акт, яким закінчено розгляд, є ухвалою.","Ухвалити додаткове рішення незалежно від того, яким видом акта завершено справу.","Постановити окрему ухвалу про допущений недолік у розподілі витрат.","Змінити основну ухвалу без застосування процедури статті 244 ГПК."],0,"Вид додаткового акта залежить від форми основного судового рішення: додаткова ухвала, рішення чи постанова.","244","117507870",2024,"905/1840/21"],[31,"Після рішення суд ухвалив додаткове рішення щодо правничих витрат. Апеляційний суд скасував основне рішення і ухвалив нове. Якою є доля додаткового рішення?",["Воно продовжує діяти до його окремого скасування, оскільки містить автономну вимогу.","Воно втрачає силу як похідний процесуальний акт від скасованого основного рішення.","Воно зберігається в частині збору, але автоматично скасовується лише в частині гонорару.","Воно перетворюється на окреме виконавче провадження, яке переглядає суд першої інстанції."],1,"ВП ВС вказала на похідність додаткового рішення: скасування основного судового рішення зумовлює втрату сили додатковим.","244","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2023,"ВП ВС 05.07.2023 № 911/3312/21"],[34,"Для визначення права касаційного оскарження у справі, розпочатій у 2022 році, особа у 2024 році обчислила поріг ціни позову за прожитковим мінімумом на день касаційної скарги. Яка дата має значення за висновком ОП КГС ВС?",["На 1 січня року подання касаційної скарги, оскільки касаційне провадження є самостійною стадією.","На день ухвалення рішення судом першої інстанції, незалежно від дати позову.","На 1 січня року подання позову, оскільки пізніша зміна показника не має змінювати процесуальні очікування у вже розпочатій справі.","На дату постановлення оскарженого рішення апеляційного суду."],2,"ОП КГС ВС виходить із розміру прожиткового мінімуму на 1 січня року подання позову при визначенні відповідного касаційного порогу.","287","106051431",2022,"924/337/18"],[34,"Касатор послався на пункт 1 частини другої статті 287 ГПК, доводячи неврахування висновку Верховного Суду щодо застосування процесуальної, а не матеріальної норми. Чи допустима така конструкція підстави?",["Ні, зазначений пункт стосується виключно застосування матеріального права.","Так, висновки Верховного Суду стосуються й процесуальних норм, якщо виконані інші вимоги відповідної підстави касації.","Так, але лише в разі оскарження постанови про закриття провадження.","Ні, оскільки процесуальні порушення можуть бути підставою тільки за пунктом 4 частини другої статті 287 ГПК."],1,"ОП КГС ВС підтвердила, що касаційний перегляд за цією підставою можливий і з посиланням на неврахування правового висновку щодо процесуальної норми.","287","105837295",2022,"908/2287/17"],[36,"Суд першої інстанції відмовив у розстроченні виконання рішення окремою ухвалою, апеляція її переглянула. Сторона подає касаційну скаргу виключно на відмову в розстроченні. Яка оцінка допустимості?",["Відмова у розстроченні завжди є самостійним об'єктом касації після апеляційного перегляду.","Ухвала не належить до переліку касаційно оскаржуваних за ст. 287 ГПК; інша оцінка можлива, якщо апеляція вперше вирішила це питання.","Скаргу слід розглядати разом з касаційною скаргою на основне рішення незалежно від предмета останньої.","Касація можлива після повторної заяви про розстрочення до суду першої інстанції."],1,"ОП КГС ВС 2025 року розмежувала оскарження ухвали про розстрочення та випадок, коли апеляційний суд вирішує питання вперше.","287, 331","128132848",2025,"908/1721/23"],[35,"КСУ визнав норму неконституційною. Заявник просить переглянути остаточне виконане рішення за виключними обставинами, хоча правовідносини завершилися до рішення КСУ. Який критерій потрібно врахувати?",["Рішення КСУ відновлює можливість перегляду будь-якого виконаного акта без обмежень у часі.","Сам факт неконституційності норми автоматично робить будь-яке рішення нововиявленою обставиною.","Перспективну дію рішення КСУ, стан виконання судового рішення та принцип юридичної визначеності.","Можливість перегляду виключно тоді, коли заявник був учасником конституційного провадження."],2,"Огляд практики ВС розмежовує дію рішення КСУ на триваючі правовідносини та повагу до res judicata щодо виконаних рішень.","320","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 320"],[23,"У спорі про право на конкретне майно третя особа просить у тому самому провадженні стягнути з відповідача заборгованість за іншим договором. Як кваліфікувати її позов із самостійними вимогами?",["Вимоги підлягають прийняттю, якщо подані до завершення підготовчого провадження, незалежно від їх зв'язку з предметом.","Вимоги можна прийняти за умови, що третя особа заплатить судовий збір як за зустрічний позов.","Вимоги не стосуються предмета наявного спору; їх можна заявляти окремим позовом, а подану заяву повернути за правилами ГПК.","Суд приєднує позов, але виділяє його в окреме провадження після підготовчого засідання."],2,"Позов третьої особи із самостійними вимогами має стосуватися того самого матеріально-правового об'єкта спору. Інакша вимога не набуває такого процесуального статусу.","49, 180","118108768",2024,"910/5635/22"],[1,"Сторони уклали застереження про передачу спору до державного суду іншої країни; відповідач ототожнює його з арбітражною угодою про недержавний міжнародний комерційний арбітраж. Яке розмежування правильне?",["Обидві угоди мають тотожні процесуальні наслідки, оскільки стосуються іноземної юрисдикції.","Угода про суд іншої держави і арбітражне застереження регулюють різні механізми, а сама арбітражна угода не завжди виключає розгляд судом України.","Угода про суд іншої держави допускається тільки між фізичними особами.","Міжнародний комерційний арбітраж входить до системи судоустрою іноземної держави."],1,"ОП КГС ВС 2023 року розмежувала державні суди іншої країни та недержавний арбітраж і їхні процесуальні наслідки.","22, 23","112145601",2023,"926/4889/22"],[13,"Позивач не заявляв клопотання про залучення співвідповідача, однак суд під час підготовчого засідання, вважаючи позов адресованим неналежній особі, вирішив змінити відповідача самостійно. Чи допустиме це?",["Допустиме за умови, що новому відповідачу надано повний строк для відзиву.","Допустиме лише до ухвалення рішення, якщо заміна не впливає на юрисдикцію.","Недопустиме без відповідного клопотання позивача, оскільки визначення відповідача належить до його диспозитивних прав.","Допустиме, якщо відповідач визнаний неналежним у висновку експерта."],2,"Стаття 48 ГПК пов'язує заміну неналежного відповідача й залучення співвідповідача з відповідним клопотанням позивача.","14, 48","122407022",2024,"914/2441/15 (914/2778/21)"],[30,"Судові витрати залишилися невирішеними після ухвалення рішення по суті. Суддя планує «уточнити» резолютивну частину як описку. Яка правильна процесуальна форма?",["Виправлення описки, оскільки розподіл витрат є технічним елементом рішення.","Ухвалення додаткового рішення відповідно до статті 244 ГПК, а не зміна суті рішення через процедуру описки.","Роз'яснення рішення за статтею 245 ГПК із одночасним визначенням нового розподілу витрат.","Вирішення питання виключно на стадії видачі наказу суду."],1,"Невирішення судових витрат є підставою для додаткового судового рішення, тоді як виправлення описки не може підміняти вирішення невстановленого питання.","243, 244","118983065",2024,"925/134/23"]];
const TOPIC_CASES=[[12,"Учасник вдруге звернувся з позовом після добровільного залишення попереднього позову без розгляду. Відповідач стверджує, що саме повторення звернення доводить штучність позову. Яка оцінка узгоджується із практикою КГС ВС?",["Повторність є самостійною достатньою ознакою зловживання, якщо сторони й предмет збігаються.","Штучний характер позову встановлюється тільки після оцінювання сукупності обставин; повторне звернення саме собою не доводить зловживання.","Штучність позову презюмується, але може бути спростована доказом сплати нового судового збору.","Кожне повторне звернення потребує попереднього дозволу суду, що розглядав попередню заяву."],1,"КГС ВС 2025 року вимагає обґрунтування висновку про штучність позову на підставі конкретних обставин, а не припущень.","43","125391728",2025,"910/2262/24"],[12,"Касаційний суд витребував докази, але учасник систематично їх не подає без пояснень. Суд застосовує штраф як процесуальний примус. У чому його процесуальна мета?",["Компенсувати іншому учаснику недоотриманий прибуток від затягування спору.","Забезпечити належне виконання процесуальних обов'язків, а не замінити матеріально-правову відповідальність за предметом спору.","Покарати сторону за обрану правову позицію незалежно від її процесуальної поведінки.","Стягнути еквівалент судового збору за всі попередні інстанції."],1,"Стаття 135 ГПК визначає штраф як засіб процесуального примусу за конкретні порушення; суд повинен мотивувати підстави застосування.","43, 135","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 135"],[3,"Після завершення строку подання заяв по суті відповідач подав «пояснення з окремого питання», хоча суд такого питання не порушував і дозволу на пояснення не надавав. Яка процесуальна реакція правильна?",["Розглядати пояснення як допустиму заяву по суті лише через їхню назву.","Залишити додаткові пояснення без розгляду, якщо суд не визнавав їх подання необхідним і процесуальний строк минув.","Автоматично визнати пояснення новим відзивом та встановити позивачу строк на відповідь.","Прийняти пояснення, якщо вони не містять нових письмових доказів."],1,"Після завершення процесуального строку додаткові пояснення не є способом обійти обмін заявами по суті; суд має оцінити умови ст. 161 ГПК.","118, 161","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 161"],[8,"В ухвалі про забезпечення позову суд не визначив зустрічного забезпечення. Відповідач згодом надав розрахунок ризику збитків і просить установити зустрічне забезпечення. Який підхід відповідає практиці 2025 року?",["Суд позбавлений повноважень розглянути питання після ухвали про основне забезпечення.","Відсутність зустрічного забезпечення в первісній ухвалі сама по собі становить безумовне порушення.","Зустрічне забезпечення є правом суду; відповідач може ініціювати його і після застосування заходів за наявності належних підстав.","Зустрічне забезпечення може бути встановлено лише до відкриття провадження у справі."],2,"КГС ВС розмежовує право суду застосувати зустрічне забезпечення та можливість відповідача подати обґрунтоване клопотання згодом.","141","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2025,"КГС ВС 22.04.2025 № 44/639-б (910/15659/24)"],[22,"Позов через підсистему «Електронний суд» подано до юридичної особи, яка зобов'язана мати електронний кабінет, але його не зареєструвала. Відповідач в апеляції вказує, що не отримав паперових копій від позивача. Як оцінювати довід?",["Нереєстрація кабінету юридичною особою має процесуальні наслідки; відсутність паперових копій за передбачених ГПК умов не обов'язково порушує її право бути обізнаною про справу.","Позивач зобов'язаний надсилати паперові копії завжди, навіть коли подає всі документи через ЄСІТС.","Суд зобов'язаний залишити позов без руху до реєстрації кабінету відповідачем.","Право відповідача на участь у справі виникає тільки після реєстрації ним електронного кабінету."],0,"Огляд КГС ВС 2022–2026 розглядає наслідки невиконання обов'язку реєстрації та обов'язок суду забезпечити належне повідомлення сторін.","6, 42, 172, 242","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 172"],[24,"Справу в межах банкрутства розглянуто спрощено, хоча за видом і складністю спору закон вимагав загального позовного провадження. Суд послався лише на зв'язок вимоги з банкрутством. Що має визначальне значення?",["Сам факт банкрутства завжди перетворює будь-який позовний спір на спрощене провадження.","Порядок розгляду визначають за процесуальним законом і характером вимог, а не лише за концентрацією спорів у справі про банкрутство.","Спрощений порядок можливий без обмежень, якщо сторони є кредиторами боржника.","Сторони можуть усунути процесуальну помилку лише відмовою від позову."],1,"Концентрація спорів у процедурі банкрутства не скасовує вимог ГПК щодо належної форми позовного провадження.","7 КУзПБ; 12 ГПК","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 12"],[26,"Сторони подали мирову угоду, яка передбачає поетапну сплату суми боргу протягом двох років. Опонент вказує на обмеження строку розстрочення виконання судового рішення за ст. 331 ГПК. Яка відповідь точніше розмежовує інститути?",["Будь-яка мирова угода зі строком понад рік суперечить ГПК.","Домовленість сторін у мировій угоді відрізняється від односторонньо ініційованого розстрочення виконання судового рішення; до них не можна механічно застосовувати тотожні обмеження.","Сторони можуть погодити такий строк лише після завершення виконавчого провадження.","Суд повинен перекваліфікувати мирову угоду в заяву за статтею 331 ГПК незалежно від змісту."],1,"Мирова угода є результатом волевиявлення сторін, на відміну від судового вирішення питання про розстрочення виконання.","192, 331","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 331"],[28,"Позивач належно повідомлений про слухання, але не з'явився, причин не повідомив і не просив розглядати справу без нього. За яких умов суд застосовує імперативний процесуальний наслідок?",["Позов належить залишити без розгляду за умов ч. 4 ст. 202 і п. 4 ч. 1 ст. 226 ГПК, якщо не наявні передбачені законом винятки.","Наслідком є автоматичне відкладення, якщо це перша неявка позивача.","Суд може вирішити спір по суті за будь-яких обставин, оскільки це наслідок диспозитивності.","Позов повертається без розгляду лише коли не з'явилися одночасно всі представники сторін."],0,"Відсутність належно повідомленого позивача без клопотання про розгляд за його відсутності та за встановлених умов веде до залишення позову без розгляду.","202, 226","107802762",2022,"905/458/21"],[29,"У первісному розрахунку адвокатських витрат сторона зазначила 30 тис. грн, після завершення спору заявила 95 тис. грн і навела пояснення щодо додаткових засідань. Як визначити, чи перевищення є істотним?",["Застосувати єдиний нормативний відсоток перевищення, визначений статтею 129 ГПК.","Визнати перевищення істотним за будь-якого збільшення більш ніж удвічі.","Оцінити конкретні обставини справи, характер додаткової роботи й обґрунтованість суми; це оціночне питання.","Застосувати виключно початковий розрахунок, оскільки він завжди має силу остаточного."],2,"КГС ВС 2023 року визначає істотність перевищення попереднього розрахунку як оціночну категорію, що залежить від обставин справи.","124, 129","115820761",2023,"916/1629/22"],[16,"Суд призначив експертизу, установивши експертну установу. Через її завантаженість інша установа може виконати дослідження раніше. Яка оцінка можливості зміни установи?",["Зміна установи можлива лише після згоди попередньої установи.","Суд може розглянути мотивовану зміну установи з дотриманням процесуальних вимог, оскільки визначення установи не є безумовно незмінним.","Експертну установу після призначення експертизи може змінити лише апеляційний суд.","Суд може змінити установу лише за нової вимоги або зміни предмета позову."],1,"У судовій практиці аналізується право суду змінити раніше визначену установу в межах процесуальної процедури призначення експертизи.","99","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 99"]];
const EXTRA_CASES=[[16,"Для перевірки факту втручання в роботу засобу обліку сторони надали експертний висновок та альтернативну «рецензію» консультанта. Чи може рецензія замінити належну експертизу, обов'язкову за спеціальним регулюванням?",["Може, якщо рецензент має стаж роботи в цій галузі не менше п'яти років.","Не може автоматично: рецензія оцінює методи й логіку дослідження, але не є повторною або додатковою експертизою для встановлення відповідного факту.","Може, якщо консалтингова організація зареєстрована як юридична особа.","Не може оцінюватися судом навіть як інша інформація щодо надійності дослідження."],1,"КГС ВС 2026 року розмежував консалтингову рецензію та висновок експерта, потрібний за спеціальним регулюванням для підтвердження певних фактичних обставин.","86, 99, 104","133719398",2026,"902/198/25"],[16,"Суд призначив експертизу у державній установі, але вона повідомила про значну чергу. Сторони не дійшли згоди, інша установа може дослідити питання раніше та дешевше. Як впливає чинність первісної ухвали?",["Первісна ухвала виключає будь-яку заміну установи до завершення експертизи.","Суд може за об'єктивних причин змінити установу, мотивуючи необхідність дотримання розумних строків розгляду.","Заміна можлива лише після добровільного відводу експертів призначеної установи.","Суд зобов'язаний скасувати всі попередні процесуальні рішення у справі."],1,"Постанова КГС ВС від 30.10.2025 допускає зміну експертної установи за об'єктивних підстав навіть за чинності первісної ухвали.","99","131424195",2025,"922/3982/23"],[2,"У позові від імені юридичної особи є лише нерозбірливий рукописний автограф, без зазначення імені й посади підписанта. Суд не може ідентифікувати підписанта та перевірити повноваження. Який наслідок застосовується?",["Залишення позову без руху для уточнення довіреності, незалежно від неможливості встановити підписанта.","Повернення позовної заяви за процесуальною підставою неможливості перевірити повноваження особи, яка її підписала.","Відкриття провадження з відкладенням перевірки повноважень до першого засідання.","Відмова у відкритті провадження з мотивів відсутності предметної юрисдикції."],1,"КГС ВС 06.03.2026 підкреслив необхідність встановити особу й процесуальні повноваження підписанта; за описаних умов застосовується повернення заяви.","162, 174","134651128",2026,"910/4231/25"],[4,"Позивач витребує частку у статутному капіталі ТОВ із чужого незаконного володіння й визначає вимогу як немайнову, оскільки просить не стягнення грошей, а передачу частки. Яка класифікація правильна?",["Це немайнова вимога, бо її результатом не є сплата грошей позивачу.","Це майнова вимога; ціна позову визначається вартістю спірної частки як об'єкта майнового права.","Це змішана вимога, яка обов'язково потребує сплати двох ставок збору незалежно від формулювання позову.","Це вимога, що не підлягає грошовій оцінці до завершення судової експертизи."],1,"Позов про витребування частки має майновий характер і грошову оцінку за вартістю спірного майна.","163","125095091",2025,"911/804/20"],[2,"Позивач об'єднав дві вимоги з різними правовими підставами. Відповідач просить повернути позов через порушення правил об'єднання, проте існує процесуальна можливість роз'єднати вимоги. Що повинен оцінити суд?",["Повернення є обов'язковим у всіх випадках недотримання зв'язку вимог.","За наявності підстав для роз'єднання позовних вимог суд повинен врахувати цей механізм і не підміняти його автоматичним поверненням.","Суд може роз'єднати вимоги виключно на спільне клопотання всіх відповідачів.","Роз'єднання можливе лише після постановлення рішення по суті."],1,"ОП КГС ВС 2023 року розмежувала повернення позову та право суду роз'єднати вимоги за статтею 173 ГПК.","173, 174","112992615",2023,"910/21280/21"],[19,"Господарська справа перебуває на розгляді, а в адміністративному суді оскаржують нормативний акт, який може бути застосований до спору. Сторона просить зупинити провадження лише до вирішення питання про чинність акта. Яка оцінка?",["Господарський суд завжди зобов'язаний зупинити справу до набрання законної сили адміністративним рішенням.","Перевірка чинності акта в іншому процесі не замінює обов'язку господарського суду самостійно застосувати право й оцінити наявність об'єктивної неможливості розгляду.","Достатньо подати копію адміністративного позову, щоб зупинення стало автоматичним.","Зупинення допускається лише якщо нормативний акт застосовується до кількох спорів одночасно."],1,"ОП КГС ВС 01.03.2024 відокремила питання застосування джерела права від фактів предмета доказування, які можуть спричиняти об'єктивну неможливість розгляду.","11, 227","117402180",2024,"910/17615/20"],[19,"Сторони ініціювали медіацію та спільно заявили клопотання про зупинення провадження за передбаченою законом підставою. Який підхід суду коректний?",["Спільна заява не впливає на процес, доки медіатор не подасть підсумкову угоду.","За наявності законної підстави для зупинення у зв'язку з медіацією суд застосовує відповідну процедуру зупинення провадження.","Медіація тягне лише відкладення засідання на один місяць.","Звернення до медіатора виключає поновлення провадження за клопотанням сторін."],1,"Ухвала КГС ВС 16.11.2023 роз'яснює обов'язок суду за належної спільної заяви сторін зупинити провадження у зв'язку з медіацією.","227","115030917",2023,"910/18802/21 (910/3246/22)"],[33,"На момент вирішення спору першою інстанцією предмет спору існував, а після ухвалення законного рішення боржник добровільно виконав зобов'язання. В апеляції сторона просить скасувати рішення й закрити справу через відсутність предмета. Яка оцінка?",["Будь-яке припинення предмета після рішення тягне обов'язкове скасування й закриття справи.","Пізніша відсутність предмета сама по собі не є підставою скасувати законне й обґрунтоване рішення; значення має законність рішення та час припинення спору.","Апеляція зобов'язана залишити скаргу без розгляду, якщо зобов'язання виконано.","Підстави закриття застосовуються лише у першій інстанції та взагалі не аналізуються апеляційним судом."],1,"ОП КГС ВС 30.08.2024 пов'язала правові наслідки припинення предмета спору з моментом такого припинення та оцінкою законності рішення першої інстанції.","231, 278","121562076",2024,"916/3006/23"],[33,"Апеляція з'ясувала, що предмет спору припинився вже після рішення першої інстанції, і водночас встановила його незаконність та необґрунтованість. Який процесуальний наслідок можливий?",["Апеляційний суд завжди має ухвалити нове рішення про відмову у позові, не зважаючи на відсутність предмета.","За описаної сукупності умов можливе скасування незаконного рішення із закриттям провадження через відсутність предмета спору.","Суд повинен повернути апеляційну скаргу без вирішення законності рішення.","Процесуальний наслідок визначає виключно виконавець, а не апеляційний суд."],1,"Та сама постанова ОП КГС ВС розрізняє наслідки припинення предмета після законного та після незаконного рішення першої інстанції.","231, 278","121562076",2024,"916/3006/23"],[27,"Сторона неодноразово просить відкласти засідання, посилаючись лише на перебування її адвоката за кордоном, не надаючи жодних підтверджень неможливості участі або залучення іншого представника. Що має оцінити суд?",["Саму наявність адвокатського статусу як достатню підставу відкладення.","Конкретні докази причин неявки, добросовісність дій і ризик затягування справи з огляду на право на розумний строк.","Виключно бажання адвоката прибути особисто, незалежно від інших можливостей участі.","Кількість попередніх задоволених клопотань, оскільки вона сама визначає законність нового відкладення."],1,"Право на представництво має узгоджуватися з добросовісним процесуальним використанням і правом на розгляд у розумний строк.","43, 202","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",2026,"Огляд КГС ВС, ст. 43"],[30,"Після судових дебатів суд оголосив перехід до ухвалення рішення й визначив дату його проголошення. Представник просить долучити нові докази, вважаючи, що розгляд по суті триває до проголошення. Який процесуальний критерій важливий?",["Стадія розгляду по суті включає весь час до вручення повного тексту рішення.","Ухвалення й проголошення є окремими від розгляду по суті етапами, а подання нових доказів повинно відповідати правилам і строкам стадії їх дослідження.","Нові докази можна долучати до завершення оформлення наказу.","Право подати докази зберігається без обмежень, якщо оголошення рішення відкладене."],1,"КГС ВС 25.09.2025 розмежував розгляд по суті та процесуальне завершення через ухвалення й проголошення судового рішення.","194, 219","130643837",2025,"913/182/20"],[17,"У господарському спорі між двома резидентами про стягнення гривні адвокатський гонорар за договором визначено в доларах. Сторона просить стягнути компенсацію в доларах. Який підхід відповідає практиці 2024 року?",["Компенсація підлягає стягненню у валюті договору з адвокатом незалежно від характеру основного спору.","У спорі між резидентами щодо гривневого зобов'язання компенсація за загальним підходом здійснюється у гривні, хоч порядок договірних розрахунків може мати інші умови.","Суд не може компенсувати такі витрати через валютну умову договору.","Валюта компенсації залежить тільки від обраного банком способу платежу."],1,"КГС ВС 31.07.2024 розмежував договірне визначення гонорару та валюту судової компенсації у спорі між резидентами України.","126, 129","120770513",2024,"921/403/22"],[18,"Експертний висновок складено на замовлення сторони; його подано з дотриманням спеціальних вимог і без судового призначення експертизи. Опонент вважає, що такий висновок за визначенням має меншу силу, ніж судова експертиза. Який підхід правильний?",["Висновок, замовлений стороною, оцінюється за загальними критеріями належності, допустимості, достовірності та в сукупності з іншими доказами.","Судовій експертизі законом надано наперед встановлену пріоритетність над висновками, замовленими сторонами.","Висновок сторони може мати силу лише після письмової згоди опонента.","Наявність двох експертних висновків із різними результатами автоматично виключає обидва із доказів."],0,"Жодний доказ не має наперед встановленої сили; навіть експертні висновки оцінюються судом відповідно до ст. 86, 104 ГПК.","86, 101, 104","133719398",2026,"902/198/25"],[29,"Умовами договору адвоката з клієнтом визначено фіксований гонорар. Переможець просить компенсацію, а опонент доводить неспівмірність і наводить обґрунтовані заперечення. Що має розмежувати суд?",["Дійсність погодженого гонорару для клієнта і розмір обґрунтованих витрат, які справедливо покладати на іншу сторону.","Будь-яке зменшення компенсації автоматично робить недійсним договір адвоката з клієнтом.","Фіксований гонорар забороняє оцінку обсягу робіт при визначенні компенсації.","Суд зобов'язаний стягнути весь гонорар, навіть якщо робота не підтверджена."],0,"Суд оцінює доведеність і співмірність суми компенсації від іншої сторони, не підміняючи договірних відносин клієнта з адвокатом.","126, 129","114834788",2023,"914/2355/21"],[21,"Відповідач не подав відзив у строк і пізніше приніс нові заперечення під виглядом листа-пояснення, не наводячи підстав для поновлення строку. Що визначає допустимість таких доводів?",["Їх правова назва; будь-які «пояснення» не обмежуються строками відзиву.","Дотримання процесуальної форми, строків та умов подання додаткових пояснень, а не лише назва документа.","Наявність повноваження адвоката, яке автоматично усуває прострочення.","Відсутність вимог про збільшення ціни позову в новому документі."],1,"Додаткові пояснення не є універсальною можливістю подати прострочені заяви по суті; застосовуються ст. 118, 161 ГПК.","118, 161, 165","120396091",2024,"925/1133/18"]];
const FINAL_CASES=[[28,"Представник напередодні засідання передав телефонограму про відкладення справи, не подавши належного процесуального клопотання. Який аспект має перевірити суд?",["Відкладення обов'язкове, якщо телефонограму передали секретареві до початку засідання.","Телефонне повідомлення не підміняє належного процесуального звернення; суд перевіряє форму, причини і підтвердження неявки.","Телефонограма рівнозначна заяві з КЕП, якщо в ній указано номер справи.","Суд має відкласти засідання, якщо учасник хоча б раз з'являвся у попередніх засіданнях."],1,"КГС ВС 2026 року звернув увагу на необхідність належної процесуальної форми звернення про відкладення.","170, 202","134960945",2026,"916/791/25"],[4,"За юридичну особу судовий збір сплатила інша компанія. У призначенні платежу зазначені справа та процесуальна дія, кошти зараховані до бюджету. Чи є особа платника підставою повторно стягувати збір?",["Так, належна сплата допускається лише заявником або його адвокатом.","Ні, якщо платіж можна належно ідентифікувати, сам факт сплати іншою особою не свідчить про несплату збору.","Так, крім випадку, коли платник є засновником заявника.","Ні, але лише коли інша компанія є третьою особою у справі."],1,"КГС ВС у постанові від 22.02.2024 розмежував суб'єкта фактичної сплати та виконання обов'язку зі сплати збору за належно ідентифікованою дією.","Закон «Про судовий збір», 6; ГПК, 164","117277048",2024,"909/69/22 (909/118/23)"],[19,"Сторона просить зупинити господарську справу, оскільки слідчий проводить досудове розслідування можливого підроблення договору, а кримінальну справу суд ще не розглядає. Чи існує обов'язкова підстава?",["Так, витяг із ЄРДР достатній для зупинення господарської справи.","Ні, досудове розслідування саме по собі не свідчить про об'єктивну неможливість розгляду господарської справи.","Так, якщо документ є основним доказом у господарській справі.","Зупинення взагалі неможливе за жодного зв'язку з кримінальним судочинством."],1,"Постанова КГС ВС від 06.08.2024 розрізняє досудове розслідування й обставини об'єктивної неможливості вирішення господарського спору.","227","120887446",2024,"917/892/23"],[5,"Дві компанії визнають факт електронного листування, проте заперечують повноваження автора листа погодити істотну зміну договору. Яка обставина має значення?",["Достатньо підтвердити, що електронна адреса корпоративна.","Слід дослідити авторство, зміст волевиявлення і повноваження відправника у сукупності з іншими доказами.","Достатньо відсутності КЕП, щоб відкинути будь-який лист.","Час доставки повідомлення сам по собі доводить повноваження його автора."],1,"ВС оцінює цифрові повідомлення у зв'язку з їхнім походженням, контекстом та іншими обставинами; електронна форма не замінює перевірку повноважень.","86, 96","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",null,"Матеріал ВС 12.03.2026"],[15,"Сторона подала відповідь генеративної моделі ШІ як доказ єдиного значення спірного технічного терміна. Чи замінює такий матеріал експертний висновок?",["Так, за умови що запит містить точний текст договору.","Ні, текст генеративної моделі сам по собі не замінює доказування та фахового дослідження; його надійність слід оцінювати критично.","Так, якщо відповідь моделі можна повторити двічі.","Ні, оскільки будь-які згадки про ШІ заборонені в господарському судочинстві."],1,"У презентації Верховного Суду з електронних доказів наведено практику про неприпустимість заміни належного обґрунтування й експертизи неперевіреним висновком ШІ.","73, 86, 99","https://court.gov.ua/storage/portal/supreme/prezent2026/Elektronni_dokazy.pdf",2025,"925/496/24"],[17,"Учасник надав документи про проїзд і проживання представника для судового засідання. Опонент стверджує, що такі витрати ніколи не входять до судових витрат. Яка оцінка?",["Ці витрати можуть бути компенсовані за наявності належних доказів, зв'язку зі справою та розумності їх розміру.","Проїзд компенсується лише штатним юристам юридичної особи.","Компенсація обмежується гонораром адвоката й судовим збором.","Сума витрат компенсується завжди в повному обсязі, якщо квитки існують."],0,"КГС ВС у постанові 12.07.2022 застосував правила оцінки необхідності й підтвердження витрат, пов'язаних із представництвом.","123, 129","105347455",2022,"903/261/21"],[10,"Після прийняття позову судом із дотриманням територіальної підсудності відповідач змінив зареєстровану адресу. Чи є це самостійною підставою передачі справи?",["Так, підсудність переоцінюється після кожної зміни адреси.","Ні, належно прийняту справу за загальним правилом розглядає той самий суд, крім винятків, визначених законом.","Так, якщо зміна адреси сталася до підготовчого засідання.","Передача здійснюється виключно за заявою позивача незалежно від підстав."],1,"Стаття 31 ГПК встановлює стабільність підсудності справи, належно прийнятої до провадження.","27, 31","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",null,"Нормативний казус, ст. 31 ГПК"],[20,"Після завершення обміну заявами сторона подала нові заперечення і докази, назвавши документ «процесуальною позицією». Суд додаткових пояснень не дозволяв. Як оцінити подання?",["Назва документа звільняє від процесуальних строків.","Суд перевіряє фактичний зміст, процесуальний строк та можливість подати додаткові пояснення; зміна назви не усуває наслідків пропуску.","Докази обов'язково приймають до проголошення рішення.","Документ є допустимим, якщо він підписаний адвокатом."],1,"КГС ВС розмежовує належне пояснення й спробу подання прострочених заперечень у невстановленій процесуальній формі.","118, 161","120396091",2024,"925/1133/18"],[27,"Адвокат просить відкласти засідання через одночасну участь в іншому процесі, але не підтвердив конфлікт графіків, про який йому було відомо заздалегідь. Який підхід коректний?",["Саме повідомлення про інше засідання є достатнім.","Слід перевірити докази перешкоди, поважність причин, добросовісність поведінки та можливість розгляду без порушення прав сторони.","Відкладення неможливе, якщо друге засідання відбувається в іншій юрисдикції.","Кількість попередніх відкладень є єдиним критерієм оцінки."],1,"Стаття 202 ГПК передбачає конкретні підстави відкладення, які належить оцінювати за обставинами справи.","202","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",null,"Нормативний казус, ст. 202 ГПК"],[32,"Після ухвалення рішення суд виявив арифметичну помилку у підсумку присуджених сум, виправлення якої не змінює вирішених вимог. Яку процедуру застосувати?",["Ухвалити додаткове рішення, оскільки йдеться про суму.","Виправити арифметичну помилку за статтею 243 ГПК без зміни суті рішення.","Роз'яснити рішення з повторним дослідженням доказів.","Здійснити перегляд за нововиявленими обставинами."],1,"Стаття 243 ГПК дозволяє виправити арифметичну помилку без нового вирішення спору по суті.","243","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",null,"Нормативний казус, ст. 243 ГПК"],[38,"Боржник подав належну заяву про скасування судового наказу в установлений строк. Стягувач просить відмовити, оскільки сума заборгованості підтверджена договором. Як діяти суду?",["Розглянути доказовість вимоги по суті і залишити наказ чинним.","Скасувати наказ за належної заяви без вирішення спору по суті в межах наказного провадження.","Призначити експертизу суми заборгованості.","Передати заяву на розгляд за правилами загального позовного провадження."],1,"За статтею 158 ГПК наявність належної своєчасної заяви боржника спричиняє скасування наказу без вирішення вимоги по суті.","157, 158","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf",null,"Нормативний казус, ст. 158 ГПК"]];

function nextScenario(cell){
 state.questionVisits??=Array(40).fill(0);
 state.questionCycle??=Array.from({length:40},()=>[]);
 const count=state.questionVisits[cell]||0;
 state.questionVisits[cell]=count+1;
 const candidates=ADVANCED_CASES.concat(EXTENDED_CASES,TOPIC_CASES,EXTRA_CASES,FINAL_CASES).map((v,i)=>({v,i})).filter(({v})=>v[0]===cell);
 const hasBase=DATA_Q[cell]?.length>=6;
 const pool=candidates.map(({i})=>"adv-"+i).concat(!candidates.length&&hasBase?["base-"+cell]:[]);
 const visited=state.questionCycle[cell]||[];
 const unused=pool.filter(id=>!visited.includes(id));
 if(!unused.length){state.questionCycle[cell]=[]}
 const available=unused.length?unused:pool;
 // Кожне нове питання клітинки використовується до вичерпання банку, далі нове коло без повтору поспіль.
 const pick=available[Math.floor(Math.random()*available.length)];
 state.questionCycle[cell].push(pick);
 let text,options,answer,explanation,article,source,origin,year,caseNumber;
 if(pick.startsWith("adv-")){
  const d=ADVANCED_CASES.concat(EXTENDED_CASES,TOPIC_CASES,EXTRA_CASES,FINAL_CASES)[Number(pick.slice(4))];
  text=d[1];options=d[2];answer=d[3];explanation=d[4];article=d[5];origin=d[6];year=d[7];caseNumber=d[8];
  source=/^https?:/.test(origin)?origin:"https://reyestr.court.gov.ua/Review/"+origin;
 }else{
  const d=DATA_Q[cell];[text,options,answer,explanation,article,source]=d;
  origin="Огляд КГС ВС 2022–2026";year=null;caseNumber="Огляд практики";
 }
 const indices=[0,1,2,3];for(let j=3;j>0;j--){let k=Math.floor(Math.random()*(j+1));[indices[j],indices[k]]=[indices[k],indices[j]]}
 return {text,options:indices.map(i=>options[i]),answer:indices.indexOf(answer),explanation,article,source,origin,year,caseNumber,variant:count+1};
}

function explainRules(){return '<div class="rules-inner"><h3>Як працює економіка гри?</h3><p><b>Бали</b> це незмінювані очки за юридичні знання. За правильну відповідь команда отримує <b>250 балів</b>, а за кожну придбану практику додатково 25 балів (не більше 75). <b>Фінальна перемога</b> визначається сумою балів компетентності та 50% залишку ПК і 50% вартості придбаних практик.</p><p><b>ПК (процесуальний капітал)</b> це умовна ігрова валюта, яку можна витрачати. На старті 500 ПК, за правильну відповідь +100 ПК, за повне коло +200 ПК. Вільну практику можна купити вже з першого ходу після правильної відповіді, якщо капіталу достатньо. Ціни становлять від 250 до 450 ПК.</p><p><b>Зелені поля</b> дають шанс заробити додаткову винагороду за правильне рішення. <b>Червоні поля</b> створюють ризик саме для команди, яка на них потрапила. <b>Процесуальний виклик</b> потребує правової відповіді; помилка коштує до 100 ПК. На клітинці «Процесуальна дуель» активна команда обирає суперника, який заявляє заперечення. Після цього активна команда захищає свою правову позицію. Картку процесуального виклику можна отримати за правильну відповідь на «Шансі» або «Лотереї», зберегти й потім використати проти іншої команди на звичайному полі. На червоному полі «Процесуальний виклик» перевірку проходить саме команда, яка на нього потрапила.</p><p><b>Чужа практика:</b> якщо команда помиляється на клітинці, яка належить супернику, вона сплачує йому до 100 ПК; правильна відповідь звільняє від платежу.</p></div>'}

 else if(op==='assign'){let p=state.players.find(p=>p.id===other.player);if(p)p.team=other.team}

 else if(op==='roll'){

 if(idx===25){state.eventType='duel';eventNote='⚔ Дуель: команда «'+t.name+'» обирає опонента. Опонент заявляє мотивоване заперечення, а команда захищає позицію.'}
 if(idx===19){state.eventType='skip';t.skip=1;eventNote='⌛ Наступний хід команди «'+t.name+'» буде пропущено. За правильну відповідь паузу буде скасовано.'}
 if(eventNote)state.notice+=(state.notice?' • ':'')+eventNote;
 const picked=nextScenario(idx);

 state.question={text,options,category:label(idx),variant,year,caseNumber,count:0,eligible:state.players.filter(p=>p.team===state.turn).length,answered:false,yourVote:null,answer:null,explanation:null,article:null,votes:null,_correct:answer,_explanation:explanation,_article:article,_source:source,_choice:null};
 state.phase=idx===25?'duel_pick':'voting';state.logs.push(t.name+': '+d1+'+'+d2+', «'+label(idx)+'» (ситуація '+variant+')');
 }
 else if(op==='vote'){if(state.phase!=='voting')throw Error('Голосування не триває');let q=state.question;q._choice=other.answer;q.count=q.eligible;q.answered=true;q.yourVote=other.answer}

function diceVisual(values,rolling=false){return `<div class="dice-scene" aria-label="Кубики: ${values.join(' і ')}">${dieCube(values[0],rolling)}${dieCube(values[1],rolling)}</div>`}
async function animatedRoll(){const b=$('#roll');if(!b||loading)return;loading=true;b.disabled=true;b.textContent='🎲 Кубики котяться…';const center=$('.centerboard');if(center){const el=document.createElement('div');el.className='dice-overlay';el.innerHTML=`<div class="dice-caption">Команда «${e(state.teams[state.turn].name)}» кидає кубики</div>${diceVisual([1,3],true)}<div class="dice-caption muted">Кидок у процесі…</div>`;center.append(el)}
await new Promise(resolve=>setTimeout(resolve,1650));const ok=await api('roll');if(ok){const overlay=$('.dice-overlay');if(overlay){overlay.innerHTML=`<div class="dice-caption">Випало ${state.dice[0]} + ${state.dice[1]} = ${state.dice[0]+state.dice[1]}</div>${diceVisual(state.dice)}<div class="dice-caption muted">${e(state.spaces[state.teams[state.turn].position])}</div>`;await new Promise(resolve=>setTimeout(resolve,1050))}}loading=false;main()}
function wireCells(){document.querySelectorAll('[data-cell]').forEach(el=>{const preview=()=>{let n=Number(el.dataset.cell),q=DATA_Q[n];if(!q)return;const modal=document.createElement('div');modal.className='cell-modal';modal.innerHTML=`<div class="panel preview-card"><button class="modal-close" aria-label="Закрити">✕</button><div class="pill">Клітинка ${n} · ${e(label(n))}</div>${buyable(n)?assetDetail(n):''}<h3>${e(q[0])}</h3><p class="hint">Під час гри команда отримає чотири варіанти відповіді. Правильна відповідь відкриється лише після голосування.</p><div class="source-links"><a target="_blank" rel="noopener" href="${e(q[5])}">Перевірити джерело</a></div></div>`;document.body.append(modal);modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.closest('.modal-close'))modal.remove()})};el.addEventListener('click',preview);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();preview()}})})}

function wireAssetCards(){document.querySelectorAll('[data-asset-cell]').forEach(el=>el.addEventListener('click',()=>{const n=Number(el.dataset.assetCell),modal=document.createElement('div');modal.className='cell-modal';modal.innerHTML='<div class="panel preview-card"><button class="modal-close" aria-label="Закрити">✕</button>'+assetDetail(n)+'</div>';document.body.append(modal);modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.closest('.modal-close'))modal.remove()})}))}
function wireVotes(){document.querySelectorAll('[data-vote]:not(:disabled)').forEach(b=>b.addEventListener('click',async()=>{await api('vote',{answer:Number(b.dataset.vote)});main()}))}
async function init(){if(room){token=localStorage.getItem(storageKey(room))||'';if(token){let success=await api('state');if(!success){token='';state=null;err=''}}}main()}
init();
</script></body></html>
