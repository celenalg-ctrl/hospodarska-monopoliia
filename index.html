:root{--bg:#091629;--panel:#12263d;--panel2:#1a324b;--gold:#eac487;--white:#f8f7f3;--muted:#aac0cf;--line:#32516c;--good:#63deb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1d4262,#091629 65%);color:var(--white);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border-radius:12px;border:1px solid var(--line);padding:11px 17px;color:#fff;background:#234866;font-weight:650}button:hover{filter:brightness(1.17)}button:disabled{opacity:.36;cursor:not-allowed}button.primary{background:linear-gradient(120deg,#edc78a,#c7954e);color:#162539;border:0}button.secondary{background:transparent}input,select{width:100%;background:#0b1b2e;border:1px solid #40617a;color:#fff;padding:12px;border-radius:10px}label{display:block;color:var(--muted);font-size:13px;margin:9px 0 5px}.wrap{max-width:1480px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #28455b;padding-bottom:18px;margin-bottom:22px}.brand{font-size:22px;letter-spacing:.035em;font-weight:850}.brand span{color:var(--gold)}.sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.17em}.panel{background:linear-gradient(145deg,rgba(26,52,76,.96),rgba(13,31,49,.96));border:1px solid #365169;border-radius:20px;padding:20px;box-shadow:0 8px 40px #0002}.intro{max-width:690px;margin:9vh auto}.intro h1{font-size:clamp(35px,5vw,58px);margin:16px 0}.intro p{color:var(--muted);font-size:18px}.intro .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.layout{display:grid;grid-template-columns:minmax(480px,1.6fr) minmax(300px,1fr);gap:20px}.col{display:flex;flex-direction:column;gap:15px}.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));aspect-ratio:1;border:4px solid #d8bc88;border-radius:12px;overflow:hidden;background:#102339;box-shadow:0 22px 70px #0005}.cell{position:relative;border:1px solid #49627b;min-width:0;padding:3px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;background:#f2efe3;color:#1c2d40}.cell .strip{height:9px;background:var(--accent,#bf9159);margin:-3px -3px 2px}.cell small{font-size:clamp(5px,.7vw,10px);font-weight:760;line-height:1.08;overflow-wrap:anywhere}.cell .number{font-size:8px;opacity:.55;position:absolute;left:3px;bottom:1px}.tokens{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}.token{width:12px;height:12px;border-radius:50%;border:1px solid white;box-shadow:0 1px 4px #0007}.centerboard{grid-area:2 / 2 / 11 / 11;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle,#264662,#0d2237 70%);padding:20px}.scale{font-size:60px;color:var(--gold)}.centerboard h2{font-size:clamp(20px,3vw,39px);line-height:1.15;margin:8px 0;color:var(--gold)}.centerboard p{font-size:12px;color:var(--muted);letter-spacing:.13em}.dice{font-size:31px;font-weight:900;background:#f2ead9;color:#13283c;width:56px;height:56px;border-radius:9px;display:inline-grid;place-items:center;border:3px solid #e6c78d;margin:3px}.turn{font-size:20px;color:var(--gold);font-weight:750}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.team{background:#10263c;border:1px solid #31516b;border-radius:13px;padding:12px}.team.active{outline:2px solid var(--gold)}.teamtop{display:flex;gap:8px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0}.score{font-size:24px;font-weight:850;margin:4px 0}.hint{color:var(--muted);font-size:13px}.headerline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#273e58;color:var(--gold);border-radius:999px;padding:5px 12px;font-weight:750;font-size:12px}.question h3{margin:12px 0;font-size:20px}.option{display:block;width:100%;text-align: .centerboard{position:relative;overflow:hidden}.dice-scene{display:flex;justify-content:center;align-items:center;gap:26px;perspective:700px;min-height:95px;margin:8px auto 6px}.die-shell{width:62px;height:62px;position:relative;filter:drop-shadow(0 17px 9px #0008)}.die-cube{position:absolute;width:62px;height:62px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform 320ms cubic-bezier(.2,.8,.2,1)}.die-face{position:absolute;width:62px;height:62px;border-radius:9px;border:2px solid #c7b593;background:linear-gradient(135deg,#fffdf6,#e3d9c4);box-shadow:inset -5px -6px 10px #a6927833,inset 3px 3px 10px #fff;color:#1e293c;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:4px}.pip{width:9px;height:9px;border-radius:50%;background:#223146;box-shadow:inset 1px 1px 2px #0006;align-self:center;justify-self:center}.f1{transform:translateZ(31px)}.f2{transform:rotateX(90deg) translateZ(31px)}.f3{transform:rotateY(90deg) translateZ(31px)}.f4{transform:rotateY(-90deg) translateZ(31px)}.f5{transform:rotateX(-90deg) translateZ(31px)}.f6{transform:rotateY(180deg) translateZ(31px)}.f1 .pip:nth-child(1){grid-area:2/2}.f2 .pip:nth-child(1){grid-area:1/1}.f2 .pip:nth-child(2){grid-area:3/3}.f3 .pip:nth-child(1){grid-area:1/1}.f3 .pip:nth-child(2){grid-area:2/2}.f3 .pip:nth-child(3){grid-area:3/3}.f4 .pip:nth-child(1){grid-area:1/1}.f4 .pip:nth-child(2){grid-area:1/3}.f4 .pip:nth-child(3){grid-area:3/1}.f4 .pip:nth-child(4){grid-area:3/3}.f5 .pip:nth-child(1){grid-area:1/1}.f5 .pip:nth-child(2){grid-area:1/3}.f5 .pip:nth-child(3){grid-area:2/2}.f5 .pip:nth-child(4){grid-area:3/1}.f5 .pip:nth-child(5){grid-area:3/3}.f6 .pip:nth-child(1){grid-area:1/1}.f6 .pip:nth-child(2){grid-area:2/1}.f6 .pip:nth-child(3){grid-area:3/1}.f6 .pip:nth-child(4){grid-area:1/3}.f6 .pip:nth-child(5){grid-area:2/3}.f6 .pip:nth-child(6){grid-area:3/3}
.die-cube.rolling{animation:die-tumble 1.55s cubic-bezier(.12,.56,.15,1) both}.die-shell:nth-child(2) .rolling{animation-delay:.08s;animation-duration:1.42s}@keyframes die-tumble{0%{transform:translate3d(-18px,-145px,0) rotateX(-110deg) rotateY(15deg) rotateZ(-20deg)}24%{transform:translate3d(3px,10px,0) rotateX(320deg) rotateY(300deg) rotateZ(130deg)}42%{transform:translate3d(22px,-72px,0) rotateX(495deg) rotateY(480deg) rotateZ(220deg)}67%{transform:translate3d(0,5px,0) rotateX(770deg) rotateY(660deg) rotateZ(320deg)}80%{transform:translate3d(-7px,-24px,0) rotateX(850deg) rotateY(730deg) rotateZ(335deg)}100%{transform:translate3d(0,0,0) rotateX(1080deg) rotateY(720deg) rotateZ(360deg)}}
.dice-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,#213b55f5,#0b1c30fb);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;animation:fadein .2s ease}.dice-overlay .dice-scene{min-height:154px;gap:38px}.dice-caption{font-weight:750;color:#f2d29a;font-size:clamp(13px,1.3vw,18px);margin:12px;text-align:center}.dice-caption.muted{font-size:12px;color:#b6d0e1}.source-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.source-links a{border:1px solid #517790;padding:8px 10px;border-radius:9px;color:#f7d399;text-decoration:none;font-size:13px}.source-links a:hover{text-decoration:underline}.cell[data-cell]{cursor:pointer}.cell[data-cell]:hover{background:#fff7e7;outline:2px solid #f2c675;z-index:1}.cell-modal{position:fixed;inset:0;background:#020a13dd;z-index:50;display:grid;place-items:center;padding:15px}.preview-card{width:min(650px,96vw);max-height:90vh;overflow:auto;position:relative}.preview-card h3{font-size:20px;line-height:1.5}.modal-close{position:absolute;right:14px;top:14px;padding:4px 10px}@keyframes fadein{from{opacity:0}to{opacity:1}}@media(max-width:620px){.die-shell,.die-cube,.die-face{width:45px;height:45px}.die-face{padding:6px;gap:2px}.pip{width:6px;height:6px}.f1{transform:translateZ(22.5px)}.f2{transform:rotateX(90deg) translateZ(22.5px)}.f3{transform:rotateY(90deg) translateZ(22.5px)}.f4{transform:rotateY(-90deg) translateZ(22.5px)}.f5{transform:rotateX(-90deg) translateZ(22.5px)}.f6{transform:rotateY(180deg) translateZ(22.5px)}.dice-scene{min-height:65px;gap:14px}.dice-overlay .dice-scene{gap:24px}}

const $=s=>document.querySelector(s), app=$('#app');let room=new URLSearchParams(location.search).get('room')?.toUpperCase()||'',token='',state=null,err='',joined=false,loading=false;const storageKey=r=>'game_'+r;let lastVote='';
const e=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const DATA_Q=[["Після повернення позову внаслідок неусунення недоліків позивач усунув недоліки та повторно звернувся до суду. Яка процесуальна оцінка повторного звернення?",["Повторний позов є недопустимим через тотожність із поверненою заявою.","Повторне звернення можливе після усунення обставин, що спричинили повернення; дата подання визначається за новим зверненням.","Позов вважається поданим у день першого звернення навіть після повернення.","Повторне звернення можливе лише після оскарження ухвали про повернення."],1,"Повернення заяви не перешкоджає повторному зверненню після усунення недоліків; не слід плутати це із своєчасним усуненням недоліків заяви, залишеної без руху.","174","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["ТОВ звернулося з вимогою до фізичної особи-поручителя за договором, який забезпечує виконання зобов’язання між двома суб’єктами господарювання. Що є визначальним для предметної юрисдикції?",["Сам факт участі фізичної особи як відповідача завжди зумовлює цивільну юрисдикцію.","Обов’язково треба встановити, чи є поручитель фізичною особою-підприємцем.","Необхідно врахувати характер основного зобов’язання та законодавчі критерії юрисдикції спору щодо забезпечувального правочину.","Юрисдикція визначається лише договірним застереженням сторін про суд."],2,"Юрисдикція спору щодо забезпечувального правочину визначається з урахуванням правил ст. 20 ГПК і характеру основного зобов’язання, а не лише статусу поручителя.","20","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Підписант позову поставив лише рукописний автограф; із заяви та додатків неможливо встановити його повноваження. Який підхід належний?",["Автограф автоматично підтверджує повноваження директора незалежно від змісту додатків.","Суд повинен перевірити повноваження підписанта за наявними процесуальними документами й реєстраційними даними, а не вважати сам автограф достатнім підтвердженням.","Підписати позов може виключно адвокат, тому будь-який підпис керівника недопустимий.","Встановлення повноважень відкладається до ухвалення рішення по суті."],1,"Сам рукописний підпис не замінює належної перевірки особи та її повноважень. Наслідок залежить від характеру дефекту підписання і процесуальної стадії.","162, 174","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позивач після закінчення встановленого судом строку подав «додаткові пояснення» з новою правовою та фактичною аргументацією, хоча суд не визнавав їх подання необхідним. Яке вирішення найбільш обґрунтоване?",["Долучити пояснення, оскільки письмові заяви по суті можна подавати без процесуальних обмежень.","Розглянути їх як обов’язкову заяву по суті, але зменшити судові витрати.","За відсутності дозволу суду на додаткові пояснення та підстав подолати процесуальні строки залишити їх без розгляду.","Автоматично повернути позов як санкцію за подання додаткових пояснень."],2,"Частина 5 ст. 161 ГПК передбачає можливість подання додаткових пояснень із дозволу суду, якщо суд визнає їх необхідними. ВП ВС, справа № 925/1133/18.","161, 118","https://reyestr.court.gov.ua/Review/120396091"],["Відповідач, фізична особа, просить про звільнення від збору під час апеляційного оскарження та доводить, що розмір збору перевищує встановлену законом частку його річного доходу. Суд відмовляє тільки тому, що заявник є відповідачем. Чи правильний підхід?",["Так, закон допускає пільгу за майновим станом виключно для позивача.","Ні, суд повинен оцінити докази наявності передбаченої законом підстави незалежно від процесуального статусу фізичної особи.","Так, оскільки процесуальний статус виключає судовий розсуд навіть за наявності доказів.","Ні, суд зобов’язаний автоматично звільнити кожну фізичну особу від збору."],1,"ВП ВС у справі № 906/308/20: не можна відмовляти лише з тієї причини, що фізична особа виступає відповідачем; потрібне дослідження підстав ст. 8 Закону «Про судовий збір».","2; Закон про судовий збір, ст. 8","https://reyestr.court.gov.ua/Review/115598835"],["Сторона подала лише скриншоти переписки в месенджері. Інша сторона заперечує їхній зміст і походження. Яка дія відповідає принципам оцінки доказів?",["Відкинути будь-які скриншоти, оскільки електронний доказ існує виключно з КЕП.","Визнати скриншоти безумовно достовірними, якщо на них видно номер телефону.","З’ясувати належність, допустимість, достовірність та зв’язок із іншими доказами; за потреби дослідити електронний оригінал.","Змінити тягар доказування на суд і самостійно встановити автентичність без участі сторін."],2,"Електронне листування та повідомлення месенджерів оцінюються за правилами доказування й у сукупності з іншими матеріалами; форма скриншота сама по собі не вирішує питання достовірності.","73, 86, 96","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Команда отримала актив «Майстер доказування». Суперник просить автоматично надати експертному висновку перевагу над іншими доказами. Як має діяти суд?",["Надати висновку перевагу, якщо експерта призначено ухвалою суду.","Покласти висновок в основу рішення, якщо сторона сплатила експертизу.","Оцінити висновок за загальними правилами, оскільки наперед установленої доказової сили він не має.","Відхилити всі інші докази, якщо висновок не був оскаржений."],2,"Статті 86, 104 ГПК: висновок експерта не має наперед установленої сили, а відхилення висновку потребує мотивування.","86, 104","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Апелянт подав клопотання про поновлення строку. У ньому наведено статті ГПК і цитати постанов, але не описано жодної фактичної причини пропуску. Яка оцінка?",["Цитування правових норм саме собою є достатнім обґрунтуванням поважності причин.","Зазначення норм не замінює викладення конкретних обставин та доказів, що об’єктивно пояснюють пропуск строку.","Будь-який пропуск автоматично є поважним після подання клопотання.","Суд зобов’язаний відмовити незалежно від того, чи можна додати докази причин."],1,"КГС ВС, справа № 910/186/21: цитати норм і практики самі собою не є порушенням питання про поновлення строку та не доводять поважності причин.","119, 256","https://reyestr.court.gov.ua/Review/112029599"],["Суд забезпечив позов, не вимагаючи зустрічного забезпечення. Відповідач згодом доводить ризик збитків та просить застосувати зустрічне забезпечення. Яка процесуальна відповідь?",["Відмовити, бо клопотання можливе тільки до первинної ухвали про забезпечення.","Визнати первинну ухвалу нікчемною через відсутність зустрічного забезпечення.","Розглянути клопотання по суті: відсутність зустрічного забезпечення в первинній ухвалі не позбавляє такого права.","Автоматично скасувати основне забезпечення незалежно від змісту клопотання."],2,"КГС ВС, справа № 44/639-б (910/15659/24): суд вправі застосувати зустрічне забезпечення й після первинної ухвали за обґрунтованим клопотанням.","141","https://reyestr.court.gov.ua/Review/126866988"],["На бонусній клітинці команда оцінює компроміс: учасники уклали мирову угоду. Яка її процесуальна природа?",["Це процесуальна дія сторін, що потребує затвердження судом із перевіркою законних умов.","Це різновид відстрочення виконання, який не потребує перевірки судом.","Це спосіб примусового виконання, що завжди застосовується виконавцем.","Це новий позов, який автоматично об’єднується з первісним."],0,"Мирова угода відрізняється від процесуальної відстрочки або розстрочки виконання рішення; суд перевіряє її умови й допустимість.","192","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позов подано з дотриманням територіальної підсудності. Після відкриття провадження склад відповідачів змінився. Чи завжди це зумовлює передачу справи?",["Так, будь-яка зміна відповідача завжди вимагає передачі справи.","Ні, суд оцінює законні правила визначення підсудності, стадію та характер зміни; сама зміна складу осіб не створює автоматичної передачі.","Так, але лише якщо позивач погоджується з передачею.","Ні, господарську підсудність можна змінити лише угодою сторін."],1,"Підсудність і її зміни регулюються нормами ГПК; необхідно розмежовувати початкове визначення суду й випадки подальшої передачі.","27, 31","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["У справі про банкрутство ТОВ позов подає ліквідатор через свій електронний кабінет, але сама юридична особа електронного кабінету не зареєструвала. Чи достатньо кабінету ліквідатора?",["Так, повноваження ліквідатора поглинають процесуальний обов’язок юридичної особи.","Так, оскільки після визнання банкрутом обов’язкова реєстрація кабінету припиняється.","Ні, обов’язок юридичної особи мати власний електронний кабінет не замінюється кабінетом ліквідатора.","Ні, але лише якщо позов поданий до іншого господарського суду."],2,"Огляд КГС ВС 2026 окремо наголошує на самостійному обов’язку юридичної особи, у тому числі в процедурі банкрутства, зареєструвати електронний кабінет.","6","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Учасник просить визнати зловживанням повторний позов після добровільного залишення попереднього позову без розгляду. Який підхід найбільш виважений?",["Повторне звернення автоматично є зловживанням незалежно від обставин.","Суд повинен дослідити мету та поведінку учасника; сама повторність не доводить зловживання.","Зловживання процесуальними правами можливе лише в касації.","Факт повторності обов’язково зумовлює штраф у максимальному розмірі."],1,"Стаття 43 ГПК потребує оцінки обставин і добросовісності поведінки, а не формального висновку лише з повторного звернення.","43","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["На підготовчому засіданні відповідач вперше просить витребувати доказ, не пояснюючи, чому не подав відповідне клопотання раніше. Яке процесуальне питання є ключовим?",["Чи вважати будь-яке клопотання про витребування доказів своєчасним до дебатів.","Чи обґрунтовано неможливість самостійно отримати доказ та дотримано вимог до строку і змісту клопотання.","Чи погоджується позивач на витребування; його згода є обов’язковою.","Чи потрібно призначити експертизу замість витребування будь-якого документа."],1,"Стаття 81 ГПК установлює вимоги до клопотання про витребування доказів; процесуальний строк не можна ігнорувати.","81","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Свідок подав нотаріально посвідчену письмову заяву, а інша сторона просить викликати його для допиту. Чи є допит обов’язковою умовою оцінки письмових показань?",["Так, без допиту будь-яка письмова заява свідка автоматично недопустима.","Ні, суд оцінює письмові показання за процесуальними правилами; питання виклику вирішується залежно від підстав і обставин.","Так, але тільки коли свідок не є працівником сторони.","Ні, адже свідків у господарському процесі взагалі не передбачено."],1,"ГПК передбачає письмову заяву свідка; виклик не є механічно обов’язковим для оцінки всіх таких заяв, але можливий за умов Кодексу.","87–90","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Позивач надав акт приймання-передачі, відповідач заперечив його автентичність і надав інші документи. Який стандарт судової оцінки?",["Акт позивача має безумовну перевагу через первинність подання.","Суд оцінює належність, допустимість, достовірність і вірогідність доказів у сукупності з мотивами прийняття або відхилення.","Заперечення відповідача автоматично позбавляє акт доказової сили.","Суд може врахувати виключно документи, що мають нотаріальне посвідчення."],1,"Статті 79 і 86 ГПК встановлюють оцінку вірогідності та доказів у сукупності; жоден документ не має наперед установленої сили.","79, 86","https://supreme.court.gov.ua/supreme/pres-centr/news/2101836/"],["Суд призначив експертизу в установі, що повідомила про надмірне завантаження. Інша державна установа може виконати її швидше. Чи вправі суд змінити установу?",["Ні, після ухвали визначена установа не може змінюватися за жодних умов.","Так, за наявності об’єктивних причин і належного мотивування така зміна допустима для забезпечення розумних строків.","Так, виключно за письмової згоди всіх учасників після призначення експертизи.","Ні, треба обов’язково скасувати всі попередні процесуальні дії і почати справу заново."],1,"КГС ВС у справі № 908/948/23 пояснив, що відсутність прямої норми про зміну установи не виключає її за об’єктивних причин.","99","https://supreme.court.gov.ua/supreme/pro_sud/rishennya_obedn_palati_kgs_vs/2025_07_04_908_948_23"],["Сторона просить компенсувати витрати на проїзд, проживання і добові представника для участі у засіданні в іншому місті. Який підхід?",["Ці витрати в принципі не можуть належати до судових витрат.","Такі витрати можуть належати до судових витрат за умови підтвердження та перевірки зв’язку з розглядом справи й розумності.","Ці витрати стягуються лише за наявності окремої угоди між сторонами.","Вони стягуються в повному розмірі автоматично, без жодних доказів."],1,"В огляді КГС ВС витрати на відрядження представника для участі в засіданні розглядаються як пов’язані з процесуальною дією та потенційно компенсовані за правилами ГПК.","123, 129","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторона подала висновок експерта, замовлений самостійно. У ньому не зазначено, що дослідження підготовлене для суду, та немає підтвердження обізнаності про кримінальну відповідальність. Який висновок?",["Документ відповідає всім вимогам, бо експерт має чинну кваліфікацію.","Достатньо процесуальної заяви сторони про те, що висновок подавався для суду.","Наведені недоліки зачіпають імперативні вимоги до такого висновку як судового доказу.","Висновок обов’язково має силу судової експертизи, навіть якщо його підготовлено для господарських переговорів."],2,"КГС ВС, справа № 911/1368/24: для висновку на замовлення учасника істотними є відомості про підготовку для суду та попередження про кримінальну відповідальність.","98, 101","https://reyestr.court.gov.ua/Review/136470342"],["Суд зупинив провадження у зв’язку з призначенням експертизи. Чи означає це остаточне припинення розгляду спору?",["Так, після ухвали про зупинення сторона мусить подати новий позов.","Ні, зупинення є тимчасовим процесуальним станом, а після усунення обставин провадження поновлюється.","Так, зупинення тотожне закриттю провадження.","Ні, але для поновлення потрібне нове рішення суду по суті спору."],1,"Статті 228–230 ГПК розмежовують зупинення та поновлення провадження.","228–230","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після вичерпання заяв по суті відповідач подав нові «письмові пояснення», що фактично змінюють заперечення. Суд не дозволяв додаткових пояснень. Що має значення?",["Назва «пояснення» дозволяє обійти строки й процедуру заяв по суті.","Суд має визначити процесуальний зміст документа та застосувати ст. 161 і правила строків; довільна назва не усуває обмежень.","Будь-яка заява відповідача автоматично стає зустрічним позовом.","Пояснення обов’язково розглядаються по суті навіть після дебатів."],1,"ВП ВС у справі № 925/1133/18 окреслила межі додаткових пояснень, що подаються з дозволу суду.","161, 118","https://reyestr.court.gov.ua/Review/120396091"],["У відзиві відповідач заперечив факт поставки, але не надіслав копії відзиву та доданих доказів іншим учасникам. Який підхід відповідає ст. 165 ГПК?",["Надсилання копій не потрібне, оскільки відзив адресований лише суду.","Відзив підлягає перевірці на дотримання обов’язку одночасного надсилання копій іншим учасникам та подання відповідних доказів надсилання.","Суд повинен автоматично визнати позов незалежно від причин ненадсилання.","Порушення можна виправити тільки під час касаційного перегляду."],1,"Стаття 165 ГПК передбачає надсилання відзиву та доданих до нього документів іншим учасникам одночасно з поданням до суду.","165","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Юридична особа обов’язково має електронний кабінет, але його не створила. Позивач подав позов через ЄСІТС і не направив паперові копії відповідачу поштою. Яка оцінка?",["Це безумовна підстава залишити позов без руху через ненадсилання паперових копій.","Такий позивач не повинен нести додаткового тягаря паперового надсилання лише через невиконання відповідачем обов’язку зареєструвати кабінет.","Позов є неподаним, доки відповідач добровільно не підтвердить ознайомлення.","Відсутність кабінету в відповідача автоматично припиняє провадження."],1,"ОП КГС ВС у справі № 908/3731/23 розмежувала обов’язок подавача і негативні наслідки для юридичної особи без обов’язкового кабінету.","6, 172, 242","https://reyestr.court.gov.ua/Review/121591790"],["Відповідач подав зустрічний позов після спливу строку для відзиву, обґрунтовуючи це зручністю спільного розгляду. Яка процесуальна умова вирішальна?",["Зустрічний позов приймається завжди, якщо обидві вимоги грошові.","Потрібно оцінити встановлений ст. 180 ГПК строк подання і взаємопов’язаність вимог; сама зручність не усуває пропуску строку.","Зустрічний позов можна заявити тільки після ухвалення рішення по первісному.","Достатньо усного погодження сторін поза судом."],1,"Стаття 180 ГПК визначає як часові вимоги, так і умови спільного розгляду зустрічного та первісного позовів.","180","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Суд розглядає в межах справи про банкрутство спір, для якого закон передбачає загальне позовне провадження. Чи достатньо автоматично застосувати спрощене через сам факт банкрутства?",["Так, усі позови в межах банкрутства є виключно спрощеними.","Ні, суд повинен застосувати належну форму провадження з урахуванням спеціальних правил і характеру спору.","Так, якщо сторони не заперечували до подання відзиву.","Ні, всі такі позови повинні бути передані до адміністративного суду."],1,"КГС ВС роз’яснює співвідношення ст. 12 ГПК та ст. 7 КУзПБ у спорах за участі боржника.","12; КУзПБ, 7","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторони хочуть мирно врегулювати спір. Одна сторона просить суд затвердити домовленість, за якою виконання рішення лише розстрочується, без взаємних поступок щодо предмета спору. Яке розмежування важливе?",["Завжди оформлювати домовленість як мирову угоду, незалежно від змісту.","Встановити, чи йдеться про матеріально-правове врегулювання спору, чи про процесуальне розстрочення виконання за ст. 331 ГПК.","Усі домовленості щодо графіка виконання автоматично припиняють виконавче провадження.","Суд позбавлений права вирішувати питання розстрочення після ухвалення рішення."],1,"Огляд КГС ВС розмежовує мирову угоду та процесуальне відстрочення або розстрочення виконання судового рішення.","192, 331","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["На стадії врегулювання спору за участю судді учасник просить дослідити докази по суті й дати оцінку перспективам позову. Який підхід відповідає природі цієї процедури?",["Суддя зобов’язаний наперед викласти зміст майбутнього рішення по суті.","Процедура має примирювальну, а не доказово-вирішальну мету; суддя не повинен підмінювати нею вирішення спору.","Будь-які висловлювання судді під час врегулювання становлять рішення суду.","Процедура автоматично змінює предмет позову."],1,"Статті 186–190 ГПК установлюють особливу процедуру врегулювання спору за участю судді; її не слід змішувати з розглядом спору по суті.","186–190","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторона просить призначити експертизу лише для з’ясування того, чи є укладений договір нікчемним. Спеціальних фактичних питань не сформульовано. Яка відповідь?",["Призначити експертизу, оскільки експерт завжди вирішує правові питання за складними договорами.","Відмовити в експертизі для вирішення суто правового питання; оцінка правових наслідків договору є компетенцією суду.","Призначити експертизу без визначення предмета дослідження.","Зупинити справу до отримання висновку адвоката з правової експертизи."],1,"ОП КГС ВС, справа № 908/948/23: експертиза потрібна для спеціальних знань в іншій сфері, ніж право; правові питання належать до компетенції суду.","99","https://supreme.court.gov.ua/supreme/pro_sud/rishennya_obedn_palati_kgs_vs/2025_07_04_908_948_23"],["Команда має актив «Процесуальна стратегія». Опонент пропонує автоматично відкласти засідання через чергове клопотання адвоката про перебування за кордоном без підтвердних доказів. Яка реакція?",["Відкладати необмежену кількість разів лише на підставі заяви представника.","Оцінити поважність причин, наявність доказів і ризик зловживання процесуальними правами.","Вважати будь-яке перебування за кордоном остаточною підставою для закриття справи.","Відмовляти у всіх клопотаннях про відкладення під час воєнного стану."],1,"У практиці щодо ст. 43 і 202 ГПК наголошено на необхідності перевірки підстав та доказів повторних клопотань про відкладення.","43, 202","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Умовна бонусна картка: сторона хоче відшкодувати витрати на правничу допомогу. Яка модель оцінки найбільш коректна?",["Стягувати суму лише тому, що вона зазначена в договорі з адвокатом.","Оцінити належні докази витрат і критерії їх розподілу, зокрема співмірність та поведінку учасників, у межах вимог і заперечень.","Завжди ділити витрати порівну незалежно від результату спору.","Відмовляти у відшкодуванні лише тому, що адвокат працював дистанційно."],1,"Статті 126 і 129 ГПК регулюють доказування, співмірність та розподіл витрат на професійну правничу допомогу.","126, 129","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Суд першої інстанції ухвалив рішення, але не розв’язав питання про розподіл понесених судових витрат. Який процесуальний інструмент передбачений?",["Виключно новий самостійний позов про витрати.","За належних умов суд, який ухвалив рішення, може ухвалити додаткове рішення.","Лише виправлення описки в основному рішенні.","Автоматичне вирішення витрат державним виконавцем."],1,"Стаття 244 ГПК передбачає додаткове рішення, зокрема коли не вирішено питання про судові витрати.","244","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Заява про додаткове рішення подана через невирішені судові витрати. Після цього основне рішення скасоване апеляційним судом. Що слід врахувати?",["Додаткове рішення завжди існує незалежно від долі основного.","Додаткове рішення має похідний характер; скасування основного рішення впливає на його правову силу.","Додаткове рішення автоматично перетворюється на самостійний виконавчий документ щодо всіх вимог.","Апеляція не може торкатися додаткового рішення навіть за скасування основного."],1,"Додаткове рішення нерозривно пов’язане з основним; огляд КГС ВС висвітлює наслідки втрати його сили після скасування основного рішення.","244","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після ухвалення рішення сторона подає документ, називаючи його «уточненням позовних вимог», із новим предметом спору. Який підхід?",["Ухвалене рішення може змінюватися за таким зверненням поза законними процедурами перегляду.","Необхідно розмежувати виправлення описок, додаткове рішення, роз’яснення та оскарження; змінювати предмет вирішеного спору таким способом не можна.","Будь-яка заява після рішення автоматично стає апеляційною скаргою.","Суд повинен прийняти нові вимоги в межах завершеного розгляду."],1,"Статті 243–245 ГПК не є процедурою нового розгляду та зміни предмета вже вирішеного спору.","243–245","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Сторони не ставили в апеляції питання про юрисдикцію спору. Апеляційний суд виявив порушення правил предметної юрисдикції господарських судів. Що він має зробити?",["Ігнорувати порушення, оскільки в апеляції діє абсолютна заборона виходити за доводи скарги.","Перевірити юрисдикцію незалежно від доводів скарги, оскільки закон відносить таке порушення до обов’язкових підстав скасування.","Передати питання юрисдикції виключно на розгляд суду касаційної інстанції.","Відкрити окреме провадження щодо юрисдикції без перегляду рішення."],1,"КГС ВС у справі № 908/2037/20: апеляційний суд перевіряє предметну юрисдикцію незалежно від доводів скарги.","269, 278","https://reyestr.court.gov.ua/Review/103320420"],["В апеляції сторона надала документ, складений уже після ухвалення рішення першої інстанції, та просить прийняти його як «новий доказ», бо раніше його не існувало. Яка оцінка?",["Прийняти автоматично: поява документа після рішення і є винятковою причиною.","За загальним підходом такий документ не є доказом, що об’єктивно не міг бути поданий у першій інстанції, оскільки на момент рішення його не існувало.","Прийняти обов’язково, якщо документ складено нотаріусом.","Прийняти лише за погодженням усіх учасників, без оцінки ст. 269."],1,"КГС ВС у справі № 906/127/24: відсутність існування доказу на час рішення першої інстанції виключає його прийняття апеляцією як додаткового доказу.","269","https://reyestr.court.gov.ua/Review/130129688"],["Заявник просить переглянути рішення за нововиявленими обставинами, посилаючись лише на новий правовий висновок ВС, сформований після рішення. Яка різниця істотна?",["Кожна нова постанова Верховного Суду сама собою є нововиявленою фактичною обставиною.","Нововиявлені обставини повинні відповідати визначеним законом критеріям істотних обставин, які існували на час розгляду; новий правовий підхід сам собою цим критеріям не відповідає.","Нововиявлені обставини можуть полягати лише у зміні складу суду.","Заява завжди приймається, якщо попереднє рішення вже виконано."],1,"Стаття 320 ГПК розмежовує істотні обставини, що існували на час розгляду, та нові докази або подальші зміни у праві.","320","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Стягувач отримав виконавчий документ. Боржник просить розстрочити виконання, посилаючись на скрутне становище. Яке процесуальне вирішення належне?",["Визнати виконання розстроченим автоматично за фактом подання заяви.","Розглянути заяву з перевіркою обставин, доказів, балансу інтересів і меж повноважень суду за ст. 331 ГПК.","Зобов’язати стягувача погодитися на довільний графік виконання.","Передати повноваження розстрочення виключно арбітражному керуючому."],1,"Стаття 331 ГПК передбачає судове вирішення заяв про відстрочку чи розстрочку з урахуванням доведених обставин.","331","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Державний виконавець повернув виконавчий документ стягувачу. Чи тотожне повернення документа автоматичному скасуванню судового рішення?",["Так, виконавче рішення одразу втрачає законну силу.","Ні, потрібно розмежовувати повернення виконавчого документа, завершення конкретних виконавчих дій та чинність судового рішення.","Так, але лише якщо стягувач не подав скаргу протягом десяти днів.","Повернення документа завжди означає повне фактичне виконання рішення."],1,"Огляд КГС ВС розглядає наслідки повернення виконавчого документа та заходів примусового виконання окремо від чинності судового рішення.","339–343; Закон про виконавче провадження","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Судовий наказ видано за вимогою, для якої допускається наказне провадження. Боржник своєчасно заявив про скасування судового наказу. Який процесуальний підхід?",["Суд у наказному провадженні повинен провести повне дослідження всіх заперечень по суті.","За дотримання вимог ГПК суд вирішує питання про скасування наказу в передбаченому порядку, а стягувачу роз’яснює право на позов.","Судовий наказ не може бути скасований після його видачі.","Скарга боржника автоматично передається Верховному Суду."],1,"Статті 157–158 ГПК визначають процедуру подання заяви про скасування судового наказу та її процесуальні наслідки.","157–158","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"],["Після завершення кола команді випала клітинка «Фініш». Яка засаднича гарантія зберігається на всіх стадіях господарського процесу?",["Суд вправі необмежено змінювати предмет позову замість сторін.","Суд забезпечує змагальність і рівність сторін, не підмінюючи їхніх процесуальних обов’язків.","Право на перегляд не може обмежуватися жодними процесуальними умовами.","Змагальність означає обов’язок суду самостійно збирати всі докази замість сторін."],1,"Статті 2, 13, 14 ГПК закріплюють засади змагальності, диспозитивності та рівності учасників.","2, 13, 14","https://court.gov.ua/storage/portal/supreme/ogliady/Oglyad_KGS_zastosGPK_02_2022_06_2026.pdf"]], DATA_SPACES=["СТАРТ", "Юрисдикція", "Позовна заява", "Процесуальна подія", "Судовий збір", "Доказування", "Процесуальний актив", "Строки", "Забезпечення позову", "БОНУС", "Підсудність", "Електронний суд", "Процесуальна подія", "Підготовче засідання", "Свідки", "Доказування", "Експертиза", "Судові витрати", "Процесуальний актив", "ПАУЗА", "Заяви по суті", "Відзив", "Процесуальна подія", "Зустрічний позов", "Спрощене провадження", "Примирення", "Врегулювання спору", "Розгляд по суті", "Процесуальний актив", "БОНУС", "Судове рішення", "Додаткове рішення", "Процесуальна подія", "Апеляція", "Касація", "Перегляд рішення", "Виконання рішення", "Судовий контроль", "Процесуальний актив", "ФІНІШ"], DATA_NAMES=["Феміда", "Касація", "Арбітри", "Правники", "Апеляція", "Юстиція"], DATA_COLORS=["#56b7ff", "#eead5d", "#75d4aa", "#bd96f7", "#f28c9d", "#9dc8ce"];
function persist(){if(state)localStorage.setItem('mono_demo_room',JSON.stringify(state))}
function makeState(){let teamCount=4;return {room:'DEMO26',phase:'lobby',host:true,players:Array.from({length:8},(_,i)=>({id:'sample'+i,name:'Учасник '+(i+1),team:null,connected:true})),teams:Array.from({length:teamCount},(_,i)=>({name:DATA_NAMES[i],color:DATA_COLORS[i],position:0,points:0,assets:0})),teamCount,turn:0,round:0,dice:null,spaces:DATA_SPACES,question:null,logs:['Демонстраційну гру створено. Вісім віртуальних учасників готові.'],settings:{mode:'random',maxRounds:5}}}
async function api(op,other={}){try{
 if(op==='create'){room='DEMO26';token='demo-host';state=makeState();localStorage.setItem(storageKey(room),token)}
 else if(op==='state'){state=JSON.parse(localStorage.getItem('mono_demo_room')||'null');if(!state)throw Error('Натисніть «Почати демонстраційну гру»');state.host=true}
 else if(!state){throw Error('Спочатку створіть демогру')}
 else if(op==='configure'){let n=Number(other.count)||4;state.teamCount=n;state.teams=Array.from({length:n},(_,i)=>({name:DATA_NAMES[i],color:DATA_COLORS[i],position:0,points:0,assets:0}));state.players.forEach(p=>p.team=null);state.settings={mode:other.mode||'random',maxRounds:other.maxRounds||5}}
 else if(op==='assign'){let p=state.players.find(p=>p.id===other.player);if(p)p.team=other.team}
 else if(op==='start'){let slots=state.teams.map((_,i)=>i);state.players.forEach((p,i)=>{if(p.team===null)p.team=slots[i%slots.length]});if(new Set(state.players.map(p=>p.team)).size<2)throw Error('Потрібні хоча б дві команди');state.phase='roll';state.turn=0;state.logs.push('Гру розпочато!')}
 else if(op==='roll'){if(state.phase!=='roll')throw Error('Зараз не можна кидати кубики');let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);state.dice=[a,b];let t=state.teams[state.turn],before=t.position;t.position=(before+a+b)%40;if(t.position<before)t.points+=100;let space=state.spaces[t.position];if(['БОНУС','СТАРТ','ФІНІШ'].includes(space))t.points+=100;if(space==='Процесуальний актив'){t.assets++;t.points+=50}if(space==='ПАУЗА')t.points=Math.max(0,t.points-50);let idx=t.position;let [text,options,answer,explanation,article,source]=DATA_Q[idx];state.question={text,options,category:space,count:0,eligible:state.players.filter(p=>p.team===state.turn).length,answered:false,yourVote:null,answer:null,explanation:null,article:null,votes:null,_correct:answer,_explanation:explanation,_article:article,_source:source,_choice:null};state.phase='voting';state.logs.push(t.name+': кубики '+a+'+'+b+', клітинка «'+space+'»')}
 else if(op==='vote'){if(state.phase!=='voting')throw Error('Голосування не триває');let q=state.question;q._choice=other.answer;q.count=q.eligible;q.answered=true;q.yourVote=other.answer}
 else if(op==='reveal'){if(state.phase!=='voting')throw Error('Спершу киньте кубики');let q=state.question;q.answer=q._correct;q.explanation=q._explanation;q.article=q._article;q.source=q._source;q.votes={};if(q._choice!==null)q.votes[q._choice]=q.eligible;let correct=q._choice===q._correct, t=state.teams[state.turn],gain=correct?(250+Math.min(t.assets,3)*25):0;t.points+=gain;state.logs.push(t.name+': '+(correct?'правильна відповідь, +'+gain+' ПБ':'помилка, +0 ПБ'));state.phase='result'}
 else if(op==='next'){if(state.phase!=='result')throw Error('Спершу відкрийте результат');state.turn=(state.turn+1)%state.teamCount;if(state.turn===0)state.round++;state.phase=state.round>=state.settings.maxRounds?'finished':'roll';state.question=null;state.dice=null}
 else if(op==='reset'){state=makeState()}
 else if(op==='join')throw Error('У цій демоверсії доступна гра на одному пристрої.');
 err='';persist();return true
 }catch(ex){err=ex.message;return false}}
function link(){return location.origin+location.pathname+'?room='+encodeURIComponent(room)}
function header(){return `<div class="headerline"><h2 style="margin:0">Кімната ${e(room)}</h2><span class="pill">${state?.phase==='lobby'?'Очікування':state?.phase==='finished'?'Завершено':'Раунд '+(state.round+1)+' / '+state.settings.maxRounds}</span></div>`}
function board(){let cells='';for(let i=0;i<40;i++){let x,y;if(i<=10){x=11-i;y=11}else if(i<=20){x=1;y=11-(i-10)}else if(i<=30){x=1+(i-20);y=1}else{x=11;y=1+(i-30)}let title=state.spaces[i],colors=['#557e99','#ad8d5b','#4d9b8e','#8e76a8','#ba786c'];let accent=title==='БОНУС'?'#36a683':title==='Процесуальна подія'?'#ac77a3':title==='Процесуальний актив'?'#b48a42':colors[Math.floor(i/8)%5];let tokens=state.teams.map((t,idx)=>t.position===i?`<span class="token" title="${e(t.name)}" style="background:${t.color}"></span>`:'').join('');cells+=`<div class="cell" tabindex="0" role="button" title="Переглянути тему клітинки" data-cell="${i}" style="grid-column:${x};grid-row:${y};--accent:${accent}"><div class="strip"></div><small>${e(title)}</small><div class="tokens">${tokens}</div><span class="number">${i}</span></div>`}return `<div class="board">${cells}<div class="centerboard"><div class="scale">⚖</div><h2>ГОСПОДАРСЬКА<br>МОНОПОЛІЯ</h2><p>СУДОВА СТРАТЕГІЯ</p><div style="margin:15px 0">${diceVisual(state.dice||[1,1])}</div><div class="hint">40 тематичних клітинок · Натисніть на клітинку, щоб переглянути ситуацію</div></div></div>`}
function teamCards(){return `<div class="teams">${state.teams.map((t,i)=>`<div class="team ${state.phase!=='lobby'&&state.turn===i?'active':''}"><div class="teamtop"><i class="dot" style="background:${t.color}"></i><b>${e(t.name)}</b></div><div class="score">${t.points} <small style="font-size:12px">ПБ</small></div><div class="hint">Учасників: ${state.players.filter(p=>p.team===i).length} • Активи: ${t.assets} • Позиція: ${t.position}</div></div>`).join('')}</div>`}
function question(){let q=state.question;if(!q)return '';let active=state.phase==='voting';let isMyTeam=state.you?.team===state.turn;let answers=q.options.map((a,i)=>`<button class="option ${q.answered&&q.yourVote===i?'picked':''} ${state.phase==='result'&&i===q.answer?'right':''} ${state.phase==='result'&&q.yourVote===i&&i!==q.answer?'wrong':''}" ${active&&(isMyTeam||state.host)&&!q.answered?'': 'disabled'} data-vote="${i}"><b>${'АБВГ'[i]}.</b> ${e(a)} ${state.phase==='result'?`<span style="float:right">${q.votes?.[i]||0}</span>`:''}</button>`).join('');return `<div class="panel question"><div class="headerline"><span class="pill">${e(q.category)}</span><span class="hint">Голосів: ${q.count} / ${q.eligible}</span></div><h3>${e(q.text)}</h3>${answers}${active?`<p class="hint">${state.host?'Деморежим: оберіть відповідь від імені команди. Потім натисніть «Завершити голосування».':isMyTeam?(q.answered?'Ваш голос зараховано. Очікуйте результату.':'Оберіть відповідь зі свого пристрою.'):'Голосує команда «'+e(state.teams[state.turn].name)+'». Очікуйте.'}</p>`:''}${state.phase==='result'?`<div class="notice"><b>Правильна відповідь: ${'АБВГ'[q.answer]}</b><p>${e(q.explanation)}</p><div class="source-links"><a target="_blank" rel="noopener" href="https://zakon.rada.gov.ua/laws/show/1798-12#Text">Норми ГПК: ${e(q.article)}</a> <a target="_blank" rel="noopener" href="${e(q.source||'https://supreme.court.gov.ua/')}">${(q.source||'').includes('/Review/')?'Постанова Верховного Суду в ЄДРСР':'Офіційний матеріал Верховного Суду'}</a></div></div>`:''}</div>`}
function main(){if(!state){let isJoining=false;app.innerHTML=`<div class="panel intro"><div class="pill">Господарський процес • Командна стратегія</div><h1>Судовий процес стає грою.</h1><p>40 тематичних клітинок, ситуації на основі ГПК та практики ВС, 3D-кубики, процесуальні активи та спільний рейтинг. У демоверсії 8 віртуальних учасників, тому можна почати одразу. Для справжнього підключення з різних телефонів потрібен окремий сервер.</p>${isJoining?`<h2>Долучитися до кімнати ${e(room)}</h2><label>Ім’я учасника</label><input id="name" maxlength="36" placeholder="Введіть ваше ім’я"><div class="actions"><button class="primary" id="join">Приєднатися</button><button class="secondary" id="back">На головну</button></div>`:`<div class="actions"><button class="primary" id="create">🎲 Почати демонстраційну гру</button><button id="joinExisting">Увійти за кодом</button></div><div id="joinArea" class="hidden"><label>Код кімнати</label><input id="code" maxlength="6" placeholder="Наприклад, X7K2QP"><button id="go">Перейти</button></div>`}<p class="error">${e(err)}</p></div>`;$('#create')?.addEventListener('click',async()=>{if(await api('create')){history.replaceState(null,'','?room='+room);main()}});$('#joinExisting')?.addEventListener('click',()=>$('#joinArea').classList.toggle('hidden'));$('#go')?.addEventListener('click',()=>{let c=$('#code').value.trim().toUpperCase();if(c){room=c;history.replaceState(null,'','?room='+room);main()}});$('#back')?.addEventListener('click',()=>{room='';history.replaceState(null,'',location.pathname);main()});$('#join')?.addEventListener('click',async()=>{if(await api('join',{name:$('#name').value})){joined=true;main()}});return}
$('#roomLabel').textContent='Кімната '+room+' • '+(state.host?'Тренер':'Учасник');let host=state.host;let current=state.teams[state.turn];let questionHTML=question();if(!host){app.innerHTML=`<div class="phone col">${header()}<div class="panel"><h3 style="margin:2px 0">${e(state.you?.name||'Учасник')}</h3><p class="hint">${state.you?.team!=null?`Ваша команда: <b style="color:${state.teams[state.you.team].color}">${e(state.teams[state.you.team].name)}</b>`:'Очікуйте розподілу на команди'}</p>${state.phase==='lobby'?`<div class="callout">Ви приєдналися. Тренер розпочне гру після формування команд. Учасників: ${state.players.length}.</div>`:state.phase==='finished'?`<h2>🏆 Гру завершено!</h2>`:`<div class="callout">Зараз ходить команда: <b>${e(current.name)}</b><br>Раунд ${state.round+1} з ${state.settings.maxRounds}</div>`}</div>${questionHTML}<div class="panel"><h3>Рейтинг команд</h3>${teamCards()}</div>${board()}<p class="error">${e(err)}</p></div>`;wireVotes();wireCells();return}
app.innerHTML=`<div class="layout"><div class="col">${header()}${board()}<div class="panel"><div class="headerline"><h3 style="margin:0">Рейтинг команд</h3><span class="pill">${state.players.length} учасників</span></div>${teamCards()}</div></div><div class="col"><div class="panel"><div class="headerline"><h3 style="margin:0">Панель тренера</h3><span class="pill">${e(state.phase)}</span></div>${state.phase==='lobby'?`<p class="hint">Це демонстраційний режим: усі 8 учасників віртуальні. Виберіть кількість команд і натисніть «Розподілити й розпочати». Посилання на цю демоверсію можна відкрити на будь-якому пристрої, але голосування між різними пристроями тут не синхронізується.</p><div class="notice">Лише для ознайомлення. Віртуальні команди, без мережевого підключення.</div><div id="qr" style="display:none"></div><div class="controls"><button id="copy">Копіювати посилання на демогру</button></div><label>Кількість команд</label><select id="teamsNum">${[2,3,4,5,6].map(x=>`<option ${x===state.teamCount?'selected':''}>${x}</option>`).join('')}</select><label>Розподіл</label><select id="mode"><option value="random" ${state.settings.mode==='random'?'selected':''}>Випадково</option><option value="manual" ${state.settings.mode==='manual'?'selected':''}>Вручну</option></select><label>Кількість раундів</label><select id="rounds">${[3,5,8,12,16,20,30].map(x=>`<option ${x===state.settings.maxRounds?'selected':''}>${x}</option>`).join('')}</select><div class="controls"><button id="config">Застосувати налаштування</button><button class="primary" id="start">Розподілити й розпочати</button></div><p class="hint">Учасники віртуальні. Непризначених система розподілить випадково при старті.</p>`:state.phase==='finished'?`<h2>🏆 Партія завершена</h2><p>Переможці: <b>${e([...state.teams].sort((a,b)=>b.points-a.points)[0].name)}</b></p><button id="reset">Нова партія</button>`:`<div class="turn">Хід команди «${e(current.name)}»</div><div class="hint">Раунд ${state.round+1} із ${state.settings.maxRounds}</div><div class="controls">${state.phase==='roll'?`<button class="primary" id="roll">🎲 Кинути кубики</button>`:''}${state.phase==='voting'?`<button class="primary" id="reveal">Завершити голосування</button>`:''}${state.phase==='result'?`<button class="primary" id="next">Наступний хід</button>`:''}<button class="secondary" id="reset">Почати заново</button></div>`}<p class="error">${e(err)}</p></div>${state.phase==='lobby'?`<div class="panel"><h3>Учасники (${state.players.length})</h3><div class="people">${state.players.length?state.players.map(p=>`<div class="person"><span>● ${e(p.name)}</span><select class="assign" data-player="${e(p.id)}"><option value="">Без команди</option>${state.teams.map((t,i)=>`<option value="${i}" ${p.team===i?'selected':''}>${e(t.name)}</option>`).join('')}</select></div>`).join(''):'Поки нікого немає'}</div></div>`:''}${questionHTML}<div class="panel"><h3>Журнал гри</h3>${state.logs.slice().reverse().map(x=>`<div class="log">${e(x)}</div>`).join('')}</div></div></div>`;
for(let op of ['start','roll','reveal','next','reset'])$('#'+op)?.addEventListener('click',async()=>{if(op==='reset'&&!confirm('Скинути партію та почати заново?'))return;if(op==='roll'){await animatedRoll();return}await api(op);main()});$('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText(link()).then(()=>{$('#copy').textContent='Скопійовано ✓'}));$('#config')?.addEventListener('click',async()=>{await api('configure',{count:Number($('#teamsNum').value),mode:$('#mode').value,maxRounds:Number($('#rounds').value)});main()});document.querySelectorAll('.assign').forEach(el=>el.addEventListener('change',async()=>{if(el.value!==''){await api('assign',{player:el.dataset.player,team:Number(el.value)});main()}}));if(false){}wireVotes();wireCells();}

const DIE_FACES=[1,2,3,4,5,6];
function dieCube(value,rolling=false){const orient={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]}[value]||[0,0];return `<div class="die-shell"><div class="die-cube ${rolling?'rolling':''}" style="--rx:${orient[0]}deg;--ry:${orient[1]}deg">${DIE_FACES.map((n,i)=>`<div class="die-face f${n}">${'<span class="pip"></span>'.repeat(n)}</div>`).join('')}</div></div>`}
function diceVisual(values,rolling=false){return `<div class="dice-scene" aria-label="Кубики: ${values.join(' і ')}">${dieCube(values[0],rolling)}${dieCube(values[1],rolling)}</div>`}
async function animatedRoll(){const b=$('#roll');if(!b||loading)return;loading=true;b.disabled=true;b.textContent='🎲 Кубики котяться…';const center=$('.centerboard');if(center){const el=document.createElement('div');el.className='dice-overlay';el.innerHTML=`<div class="dice-caption">Команда «${e(state.teams[state.turn].name)}» кидає кубики</div>${diceVisual([1,3],true)}<div class="dice-caption muted">Кидок у процесі…</div>`;center.append(el)}
await new Promise(resolve=>setTimeout(resolve,1650));const ok=await api('roll');if(ok){const overlay=$('.dice-overlay');if(overlay){overlay.innerHTML=`<div class="dice-caption">Випало ${state.dice[0]} + ${state.dice[1]} = ${state.dice[0]+state.dice[1]}</div>${diceVisual(state.dice)}<div class="dice-caption muted">${e(state.spaces[state.teams[state.turn].position])}</div>`;await new Promise(resolve=>setTimeout(resolve,1050))}}loading=false;main()}
function wireCells(){document.querySelectorAll('[data-cell]').forEach(el=>{const preview=()=>{let n=Number(el.dataset.cell),q=DATA_Q[n];if(!q)return;const modal=document.createElement('div');modal.className='cell-modal';modal.innerHTML=`<div class="panel preview-card"><button class="modal-close" aria-label="Закрити">✕</button><div class="pill">Клітинка ${n} · ${e(DATA_SPACES[n])}</div><h3>${e(q[0])}</h3><p class="hint">Під час гри команда отримає чотири варіанти відповіді. Правильна відповідь відкриється лише після голосування.</p><div class="source-links"><a target="_blank" rel="noopener" href="${e(q[5])}">Перевірити джерело</a></div></div>`;document.body.append(modal);modal.addEventListener('click',ev=>{if(ev.target===modal||ev.target.closest('.modal-close'))modal.remove()})};el.addEventListener('click',preview);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();preview()}})})}

function wireVotes(){document.querySelectorAll('[data-vote]:not(:disabled)').forEach(b=>b.addEventListener('click',async()=>{await api('vote',{answer:Number(b.dataset.vote)});main()}))}
async function init(){if(room){token=localStorage.getItem(storageKey(room))||'';if(token){let success=await api('state');if(!success){token='';state=null;err=''}}}main()}
init();
</script></body></html>
