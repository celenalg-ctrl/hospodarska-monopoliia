function link(){return location.origin+location.pathname+'?room='+encodeURIComponent(room)}
function header(){return `<div class="headerline"><h2 style="margin:0">Кімната ${e(room)}</h2><span class="pill">${state?.phase==='lobby'?'Очікування':state?.phase==='finished'?'Завершено':'Раунд '+(state.round+1)+' / '+state.settings.maxRounds}</span></div>`}
function board(){let cells='';for(let i=0;i<40;i++){let x,y;if(i<=10){x=11-i;y=11}else if(i<=20){x=1;y=11-(i-10)}else if(i<=30){x=1+(i-20);y=1}else{x=11;y=1+(i-30)}let title=state.spaces[i],colors=['#557e99','#ad8d5b','#4d9b8e','#8e76a8','#ba786c'];let accent=title==='БОНУС'?'#36a683':title==='Процесуальна подія'?'#ac77a3':title==='Процесуальний актив'?'#b48a42':colors[Math.floor(i/8)%5];let tokens=state.teams.map((t,idx)=>t.position===i?`<span class="token" title="${e(t.name)}" style="background:${t.color}"></span>`:'').join('');cells+=`<div class="cell" style="grid-column:${x};grid-row:${y};--accent:${accent}"><div class="strip"></div><small>${e(title)}</small><div class="tokens">${tokens}</div><span class="number">${i}</span></div>`}return `<div class="board">${cells}<div class="centerboard"><div class="scale">⚖</div><h2>ГОСПОДАРСЬКА<br>МОНОПОЛІЯ</h2><p>СУДОВА СТРАТЕГІЯ</p><div style="margin:15px 0">${state.dice?state.dice.map(x=>`<span class="dice">${x}</span>`).join(''):'🎲 🎲'}</div><div class="hint">40 клітинок • Командна гра</div></div></div>`}
function teamCards(){return `<div class="teams">${state.teams.map((t,i)=>`<div class="team ${state.phase!=='lobby'&&state.turn===i?'active':''}"><div class="teamtop"><i class="dot" style="background:${t.color}"></i><b>${e(t.name)}</b></div><div class="score">${t.points} <small style="font-size:12px">ПБ</small></div><div class="hint">Учасників: ${state.players.filter(p=>p.team===i).length} • Активи: ${t.assets} • Позиція: ${t.position}</div></div>`).join('')}</div>`}
function question(){let q=state.question;if(!q)return '';let active=state.phase==='voting';let isMyTeam=state.you?.team===state.turn;let answers=q.options.map((a,i)=>`<button class="option ${q.answered&&q.yourVote===i?'picked':''} ${state.phase==='result'&&i===q.answer?'right':''} ${state.phase==='result'&&q.yourVote===i&&i!==q.answer?'wrong':''}" ${active&&(isMyTeam||state.host)&&!q.answered?'': 'disabled'} data-vote="${i}"><b>${'АБВГ'[i]}.</b> ${e(a)} ${state.phase==='result'?`<span style="float:right">${q.votes?.[i]||0}</span>`:''}</button>`).join('');return `<div class="panel question"><div class="headerline"><span class="pill">${e(q.category)}</span><span class="hint">Голосів: ${q.count} / ${q.eligible}</span></div><h3>${e(q.text)}</h3>${answers}${active?`<p class="hint">${state.host?'Деморежим: оберіть відповідь від імені команди. Потім натисніть «Завершити голосування».':isMyTeam?(q.answered?'Ваш голос зараховано. Очікуйте результату.':'Оберіть відповідь зі свого пристрою.'):'Голосує команда «'+e(state.teams[state.turn].name)+'». Очікуйте.'}</p>`:''}${state.phase==='result'?`<div class="notice"><b>Правильна відповідь: ${'АБВГ'[q.answer]}</b><p>${e(q.explanation)}</p><a style="color:#eac487" target="_blank" rel="noopener" href="https://zakon.rada.gov.ua/laws/show/1798-12#Text">ГПК України, ст. ${e(q.article)} (офіційний текст)</a></div>`:''}</div>`}
function main(){if(!state){let isJoining=false;app.innerHTML=`<div class="panel intro"><div class="pill">Господарський процес • Командна стратегія</div><h1>Судовий процес стає грою.</h1><p>40 клітинок, юридичні ситуації, кубики, процесуальні активи та спільний рейтинг. У демоверсії 8 віртуальних учасників, тому можна почати одразу. Для справжнього підключення з різних телефонів потрібен окремий сервер.</p>${isJoining?`<h2>Долучитися до кімнати ${e(room)}</h2><label>Ім’я учасника</label><input id="name" maxlength="36" placeholder="Введіть ваше ім’я"><div class="actions"><button class="primary" id="join">Приєднатися</button><button class="secondary" id="back">На головну</button></div>`:`<div class="actions"><button class="primary" id="create">🎲 Почати демонстраційну гру</button><button id="joinExisting">Увійти за кодом</button></div><div id="joinArea" class="hidden"><label>Код кімнати</label><input id="code" maxlength="6" placeholder="Наприклад, X7K2QP"><button id="go">Перейти</button></div>`}<p class="error">${e(err)}</p></div>`;$('#create')?.addEventListener('click',async()=>{if(await api('create')){history.replaceState(null,'','?room='+room);main()}});$('#joinExisting')?.addEventListener('click',()=>$('#joinArea').classList.toggle('hidden'));$('#go')?.addEventListener('click',()=>{let c=$('#code').value.trim().toUpperCase();if(c){room=c;history.replaceState(null,'','?room='+room);main()}});$('#back')?.addEventListener('click',()=>{room='';history.replaceState(null,'',location.pathname);main()});$('#join')?.addEventListener('click',async()=>{if(await api('join',{name:$('#name').value})){joined=true;main()}});return}
$('#roomLabel').textContent='Кімната '+room+' • '+(state.host?'Тренер':'Учасник');let host=state.host;let current=state.teams[state.turn];let questionHTML=question();if(!host){app.innerHTML=`<div class="phone col">${header()}<div class="panel"><h3 style="margin:2px 0">${e(state.you?.name||'Учасник')}</h3><p class="hint">${state.you?.team!=null?`Ваша команда: <b style="color:${state.teams[state.you.team].color}">${e(state.teams[state.you.team].name)}</b>`:'Очікуйте розподілу на команди'}</p>${state.phase==='lobby'?`<div class="callout">Ви приєдналися. Тренер розпочне гру після формування команд. Учасників: ${state.players.length}.</div>`:state.phase==='finished'?`<h2>🏆 Гру завершено!</h2>`:`<div class="callout">Зараз ходить команда: <b>${e(current.name)}</b><br>Раунд ${state.round+1} з ${state.settings.maxRounds}</div>`}</div>${questionHTML}<div class="panel"><h3>Рейтинг команд</h3>${teamCards()}</div>${board()}<p class="error">${e(err)}</p></div>`;wireVotes();return}
app.innerHTML=`<div class="layout"><div class="col">${header()}${board()}<div class="panel"><div class="headerline"><h3 style="margin:0">Рейтинг команд</h3><span class="pill">${state.players.length} учасників</span></div>${teamCards()}</div></div><div class="col"><div class="panel"><div class="headerline"><h3 style="margin:0">Панель тренера</h3><span class="pill">${e(state.phase)}</span></div>${state.phase==='lobby'?`<p class="hint">Це демонстраційний режим: усі 8 учасників віртуальні. Виберіть кількість команд і натисніть «Розподілити й розпочати». Посилання на цю демоверсію можна відкрити на будь-якому пристрої, але голосування між різними пристроями тут не синхронізується.</p><div class="notice">Лише для ознайомлення. Віртуальні команди, без мережевого підключення.</div><div id="qr" style="display:none"></div><div class="controls"><button id="copy">Копіювати посилання на демогру</button></div><label>Кількість команд</label><select id="teamsNum">${[2,3,4,5,6].map(x=>`<option ${x===state.teamCount?'selected':''}>${x}</option>`).join('')}</select><label>Розподіл</label><select id="mode"><option value="random" ${state.settings.mode==='random'?'selected':''}>Випадково</option><option value="manual" ${state.settings.mode==='manual'?'selected':''}>Вручну</option></select><label>Кількість раундів</label><select id="rounds">${[3,5,8,12,16,20,30].map(x=>`<option ${x===state.settings.maxRounds?'selected':''}>${x}</option>`).join('')}</select><div class="controls"><button id="config">Застосувати налаштування</button><button class="primary" id="start">Розподілити й розпочати</button></div><p class="hint">Учасники віртуальні. Непризначених система розподілить випадково при старті.</p>`:state.phase==='finished'?`<h2>🏆 Партія завершена</h2><p>Переможці: <b>${e([...state.teams].sort((a,b)=>b.points-a.points)[0].name)}</b></p><button id="reset">Нова партія</button>`:`<div class="turn">Хід команди «${e(current.name)}»</div><div class="hint">Раунд ${state.round+1} із ${state.settings.maxRounds}</div><div class="controls">${state.phase==='roll'?`<button class="primary" id="roll">🎲 Кинути кубики</button>`:''}${state.phase==='voting'?`<button class="primary" id="reveal">Завершити голосування</button>`:''}${state.phase==='result'?`<button class="primary" id="next">Наступний хід</button>`:''}<button class="secondary" id="reset">Почати заново</button></div>`}<p class="error">${e(err)}</p></div>${state.phase==='lobby'?`<div class="panel"><h3>Учасники (${state.players.length})</h3><div class="people">${state.players.length?state.players.map(p=>`<div class="person"><span>● ${e(p.name)}</span><select class="assign" data-player="${e(p.id)}"><option value="">Без команди</option>${state.teams.map((t,i)=>`<option value="${i}" ${p.team===i?'selected':''}>${e(t.name)}</option>`).join('')}</select></div>`).join(''):'Поки нікого немає'}</div></div>`:''}${questionHTML}<div class="panel"><h3>Журнал гри</h3>${state.logs.slice().reverse().map(x=>`<div class="log">${e(x)}</div>`).join('')}</div></div></div>`;
for(let op of ['start','roll','reveal','next','reset'])$('#'+op)?.addEventListener('click',async()=>{if(op==='reset'&&!confirm('Скинути партію та почати заново?'))return;await api(op);main()});$('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText(link()).then(()=>{$('#copy').textContent='Скопійовано ✓'}));$('#config')?.addEventListener('click',async()=>{await api('configure',{count:Number($('#teamsNum').value),mode:$('#mode').value,maxRounds:Number($('#rounds').value)});main()});document.querySelectorAll('.assign').forEach(el=>el.addEventListener('change',async()=>{if(el.value!==''){await api('assign',{player:el.dataset.player,team:Number(el.value)});main()}}));if(false){}wireVotes();}
function wireVotes(){document.querySelectorAll('[data-vote]:not(:disabled)').forEach(b=>b.addEventListener('click',async()=>{await api('vote',{answer:Number(b.dataset.vote)});main()}))}
async function init(){if(room){token=localStorage.getItem(storageKey(room))||'';if(token){let success=await api('state');if(!success){token='';state=null;err=''}}}main()}
init();
</script></body></html>
